<!-- START OF FILE: index.html (Trident v22) -->
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
    <link rel="manifest" href="manifest.json"/>
    <title>Trident v22</title>
    <style>
        :root {
            --bg: #FFFFFF; --header-bg: #1e293b; --border: #E2E8F0;
            --text: #1e293b; --accent: #2563EB;
            --weekend: #f8fafc; --today-bg: #ffffcc;
            --pink-pending: #fff1f2; --green-done: #dcfce7;
        }
        body { font-family: sans-serif; margin: 0; padding: 0; background: white; color: var(--text); }
        .hdr { background: #1e293b; color: white; padding: 5px 10px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 2000; height: 50px; }
        .v-badge { background: #2563EB; color: white; padding: 2px 5px; border-radius: 4px; font-size: 9px; font-weight: bold; cursor: pointer; }
        .nav-btn { background: #334155; color: white; border: 1px solid #475569; border-radius: 4px; padding: 8px 12px; font-size: 13px; cursor: pointer; font-weight: bold; }
        .nav-btn.active { background: #2563EB; border-color: white; }
        .nav-btn.sync { background: #10b981; }

        .grid { display: block; width: 100%; min-width: 850px; padding-bottom: 100px; }
        
        /* Nc1: Aliniere fixa la baza rândului */
        .h-r { display: flex; width: 100%; background: #f1f5f9; font-weight: bold; font-size: 11px; position: sticky; top: 50px; z-index: 1500; border-bottom: 2px solid #cbd5e1; height: 45px; }
        .h-r .c { display: flex !important; justify-content: flex-end !important; align-items: center !important; padding-bottom: 6px !important; flex-direction: column; }

        .r { display: flex; width: 100%; border-bottom: 1px solid var(--border); min-height: 55px; }
        .c { border-right: 1px solid var(--border); padding: 4px; flex: 1; overflow: hidden; display: flex; flex-direction: column; }
        .c-fix { flex: 0 0 50px; justify-content: center; text-align: center; font-weight: bold; }
        .c-sticky { position: sticky; left: 0; z-index: 100; background: #f8fafc; }
        .c-date { left: 50px; border-right: 2px solid #cbd5e1; }

        .r.weekend { background-color: var(--weekend); }
        .r.today { background-color: var(--today-bg); outline: 2px solid orange; outline-offset: -2px; }

        .ev-item { display: flex; align-items: flex-start; gap: 5px; padding: 4px; border-radius: 4px; margin-bottom: 3px; border: 1px solid rgba(0,0,0,0.05); font-size: 12px; font-weight: 600; line-height: 1.2; }
        .ev-item.pending { background: var(--pink-pending); border-left: 3px solid #f43f5e; }
        .ev-item.done { background: var(--green-done); border-left: 3px solid #22c55e; opacity: 0.8; }
        .chk { width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; margin-top: 1px; }
        .j-box { width: 100%; border: none; background: transparent; font-size: 12px; font-style: italic; resize: none; outline: none; border-top: 1px dotted #ccc; margin-top: auto; padding-top: 4px; }
        .tap-area { flex-grow: 1; min-height: 20px; cursor: pointer; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; align-items: center; justify-content: center; padding: 20px; }
        .m-box { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; color: black; }
        .cmd-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #f1f5f9; padding: 8px; display: flex; border-top: 2px solid #2563EB; z-index: 2000; }
    </style>
</head>

<body onload="initApp()">

<header class="hdr">
    <div class="v-badge" onclick="syncAllToGoogle()">v22</div>
    <div id="mLabel" style="font-weight: bold; font-size: 14px; text-transform: uppercase; flex-grow: 1; text-align: center;">...</div>
    <div style="display:flex; gap:6px; align-items: center;">
        <button id="btnEco" class="nav-btn" onclick="toggleEco()">ECONOM</button>
        <button class="nav-btn sync" onclick="calLogin()">SYNC</button>
        <button class="nav-btn" onclick="navMonth(-1)"> &lt; </button>
        <button class="nav-btn" onclick="navMonth(1)"> &gt; </button>
    </div>
</header>

<div class="grid" id="mainGrid">
    <div class="h-r">
        <div class="c c-fix c-sticky">NRZ</div>
        <div class="c c-fix c-sticky c-date">ZI</div>
        <div class="c">LUNARE</div>
        <div class="c">CURENTE / JURNAL</div>
        <div class="c">ANUALE</div>
    </div>
    <div id="gridBody"></div>
</div>

<div class="cmd-bar">
    <input type="text" id="cmdInput" style="flex:1; padding:12px; border:1px solid #ccc; font-size: 16px;" placeholder="Ex: /c 15 RL Pizza sau Notă /c 10">
    <button onclick="runCommand()" style="margin-left:8px; padding:10px 25px; background:#2563EB; color:white; border:none; font-weight: bold; border-radius: 5px;">OK</button>
</div>

<div id="editModal" class="modal">
    <div class="m-box">
        <h3 id="modalTitle">Eveniment</h3>
        <input type="text" id="evName" style="width:100%; padding:10px; margin-bottom:10px;">
        <input type="number" id="evDur" value="1" style="width:100%; padding:10px; margin-bottom:10px;">
        <div style="display:flex; gap:10px;">
            <button class="nav-btn" style="flex:1; background:#ccc; color:black;" onclick="closeModal()">ANULARE</button>
            <button class="nav-btn" style="flex:1; background:var(--accent);" id="btnSave">SALVEAZĂ</button>
        </div>
    </div>
</div>

<script>
    var GCAL_CLIENT_ID = '705792153280-6u766blorfafm3taeonfcufbihggd3ee.apps.googleusercontent.com';
    var GCAL_REDIRECT = window.location.origin + window.location.pathname;
    
    var viewDate = new Date();
    var localDB = [], journalData = {}, googleEvents = [], gDoneMap = {}, ecoMode = false, editRef = null;

    function initApp() {
        try {
            var sDB = localStorage.getItem('trident_db_v22') || localStorage.getItem('trident_db_v21');
            if(sDB) localDB = JSON.parse(sDB);
            var sJ = localStorage.getItem('trident_j_v22') || localStorage.getItem('trident_j_v21');
            if(sJ) journalData = JSON.parse(sJ);
            var sGD = localStorage.getItem('trident_g_done_v22') || localStorage.getItem('trident_g_done_v21');
            if(sGD) gDoneMap = JSON.parse(sGD);
            var sGE = localStorage.getItem('trident_g_cache_v22') || localStorage.getItem('trident_g_cache_v21');
            if(sGE) googleEvents = JSON.parse(sGE);

            ecoMode = localStorage.getItem('trident_eco') === 'true';
            document.getElementById('btnEco').className = ecoMode ? "nav-btn active" : "nav-btn";

            if(window.location.hash.indexOf('access_token') > -1) handleGoogleCallback();
            else renderCalendar();
        } catch(e) { console.error(e); }
    }

    // L1: Detector avansat de tip de coloana
    function detectType(summary, googleType) {
        var s = summary.toLowerCase();
        var yearlyKeywords = ["sf.", "sfânt", "adormirea", "zi de na", "birthday", "aniversare", "nunta", "cununa", "botez"];
        for(var i=0; i<yearlyKeywords.length; i++) {
            if(s.indexOf(yearlyKeywords[i]) > -1) return 'a';
        }
        return googleType;
    }

    async function syncGoogle() {
        var token = localStorage.getItem('gcal_token');
        if (!token) return;
        var start = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1).toISOString();
        var end = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0, 23, 59, 59).toISOString();
        try {
            var resp = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin="+start+"&timeMax="+end+"&singleEvents=true&orderBy=startTime", {
                headers: { Authorization: "Bearer " + token }
            });
            var data = await resp.json();
            if (data.items) {
                googleEvents = data.items.map(function(ge) {
                    var startDt = new Date(ge.start.dateTime || ge.start.date);
                    var endDt = new Date(ge.end.dateTime || ge.end.date);
                    var duration = Math.round((endDt - startDt) / (86400000));
                    if (duration < 1) duration = 1;
                    
                    var type = 'c';
                    if (ge.recurringEventId || (ge.recurrence)) {
                        type = (ge.start.date && !ge.start.dateTime) ? 'a' : 'm';
                    }
                    type = detectType(ge.summary, type); // Rafinare L1

                    return { id: 'G_'+ge.id, d: startDt.getDate(), m: startDt.getMonth(), y: startDt.getFullYear(), n: ge.summary, t: type, dur: duration, isG: true };
                });
                localStorage.setItem('trident_g_cache_v22', JSON.stringify(googleEvents));
                
                // S1: Push automnat date locale catre Google
                syncAllToGoogle();
                renderCalendar();
            }
        } catch (e) { renderCalendar(); }
    }

    // S1: Trimite tot la Google
    async function syncAllToGoogle() {
        var token = localStorage.getItem('gcal_token');
        if(!token) return;
        // Trimitem task-uri locale care nu sunt marcate ca fiind in cloud
        for(var i=0; i<localDB.length; i++) {
            if(!localDB[i].inCloud) {
                await postToGoogle(localDB[i]);
                localDB[i].inCloud = true;
            }
        }
        // Trimitem Jurnalul ca All-Day Events
        for(var key in journalData) {
            if(journalData[key] && !localStorage.getItem('cloud_j_'+key)) {
                var parts = key.split('-');
                await postToGoogle({ n: "[Jurnal] " + journalData[key], d: parseInt(parts[2]), m: parseInt(parts[1]), y: parseInt(parts[0]), t: 'c' });
                localStorage.setItem('cloud_j_'+key, 'true');
            }
        }
        saveAll();
    }

    async function postToGoogle(ev) {
        var token = localStorage.getItem('gcal_token');
        var dateStr = ev.y + "-" + String(ev.m+1).padStart(2,'0') + "-" + String(ev.d).padStart(2,'0');
        var body = { summary: ev.n, start: { date: dateStr }, end: { date: dateStr } };
        if (ev.t === 'm') body.recurrence = ["RRULE:FREQ=MONTHLY"];
        if (ev.t === 'a') body.recurrence = ["RRULE:FREQ=YEARLY"];
        try {
            await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", {
                method: 'POST',
                headers: { Authorization: "Bearer " + token, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
        } catch (e) {}
    }

    function renderCalendar() {
        var body = document.getElementById('gridBody');
        var Y = viewDate.getFullYear(), M = viewDate.getMonth();
        var now = new Date(); now.setHours(0,0,0,0);
        var monthNames = ["Ianuarie", "Februarie", "Martie", "Aprilie", "Mai", "Iunie", "Iulie", "August", "Septembrie", "Octombrie", "Noiembrie", "Decembrie"];
        var dayNames = ["DU", "LU", "MA", "MI", "JO", "VI", "SA"];
        document.getElementById('mLabel').innerHTML = monthNames[M] + " " + Y;
        var lastDay = new Date(Y, M + 1, 0).getDate();
        
        // E1: Calculam prima zi "murdara"
        var firstBadDay = 1;
        if(ecoMode && M === now.getMonth() && Y === now.getFullYear()) {
            for(var i=1; i<=lastDay; i++) {
                var k = Y + "-" + M + "-" + i;
                var hasPending = localDB.concat(googleEvents).some(function(e) {
                    var s = new Date(e.y, e.m, e.d), end = new Date(e.y, e.m, e.d + (e.dur||1)-1);
                    var cur = new Date(Y,M,i);
                    return cur >= s && cur <= end && !(e.isG ? gDoneMap[e.id] : e.done);
                });
                if(hasPending || journalData[k] || i === now.getDate()) { firstBadDay = i; break; }
            }
        }

        var html = "";
        for (var d = 1; d <= lastDay; d++) {
            if (ecoMode && d < firstBadDay) continue; // E1: Skip zile curate de la inceput

            var curDt = new Date(Y, M, d);
            var isToday = (curDt.toDateString() === now.toDateString());
            var key = Y + "-" + M + "-" + d;
            var allEvs = localDB.concat(googleEvents);
            var dayEvs = [];
            for(var j=0; j<allEvs.length; j++) {
                var e = allEvs[j];
                var start = new Date(e.y, e.m, e.d), end = new Date(e.y, e.m, e.d + (e.dur || 1) - 1);
                if(curDt >= start && curDt <= end) dayEvs.push(e);
            }

            var rowClass = "r" + (isToday ? " today" : "") + (curDt.getDay() % 6 === 0 ? " weekend" : "");
            html += '<div class="' + rowClass + '" ' + (isToday ? 'id="scroll-today"' : '') + '>';
            html += '<div class="c c-fix c-sticky">' + d + '</div>';
            html += '<div class="c c-fix c-sticky c-date">' + dayNames[curDt.getDay()] + '</div>';
            html += '<div class="c" onclick="openEdit('+d+', \'m\')">' + drawItems(dayEvs, 'm') + '<div class="tap-area"></div></div>';
            html += '<div class="c" onclick="openEdit('+d+', \'c\')">' + drawItems(dayEvs, 'c');
            html += '<textarea class="j-box" placeholder="..." onblur="saveJ(\''+key+'\', this.value)">' + (journalData[key] || '') + '</textarea><div class="tap-area"></div></div>';
            html += '<div class="c" onclick="openEdit('+d+', \'a\')">' + drawItems(dayEvs, 'a') + '<div class="tap-area"></div></div>';
            html += '</div>';
        }
        body.innerHTML = html;
        if(M === now.getMonth()) setTimeout(function() { document.getElementById('scroll-today')?.scrollIntoView({block: "center", behavior: "smooth"}); }, 500);
    }

    function drawItems(list, type) {
        var res = "";
        for(var i=0; i<list.length; i++) {
            var e = list[i];
            if(e.t === type) {
                var isDone = e.isG ? gDoneMap[e.id] : e.done;
                res += '<div class="ev-item ' + (isDone ? "done" : "pending") + '" onclick="event.stopPropagation(); editItem(\''+e.id+'\')">';
                res += '<input type="checkbox" class="chk" ' + (isDone ? 'checked' : '') + ' onclick="event.stopPropagation(); tglStatus(\''+e.id+'\','+!!e.isG+')">';
                res += '<span>' + (e.isG ? "☁️ " : "• ") + e.n + '</span></div>';
            }
        }
        return res;
    }

    function tglStatus(id, isG) {
        if(isG) { gDoneMap[id] = !gDoneMap[id]; localStorage.setItem('trident_g_done_v22', JSON.stringify(gDoneMap)); }
        else { for(var i=0; i<localDB.length; i++) if(localDB[i].id === id) localDB[i].done = !localDB[i].done; }
        saveAll(); renderCalendar();
    }

    function saveAll() { localStorage.setItem('trident_db_v22', JSON.stringify(localDB)); localStorage.setItem('trident_j_v22', JSON.stringify(journalData)); }
    function saveJ(key, val) { journalData[key] = val; saveAll(); }
    function navMonth(dir) { viewDate.setMonth(viewDate.getMonth() + dir); googleEvents = []; renderCalendar(); syncGoogle(); }
    function toggleEco() { ecoMode = !ecoMode; localStorage.setItem('trident_eco', ecoMode); renderCalendar(); }
    function closeModal() { document.getElementById('editModal').style.display = 'none'; }
    function openEdit(d, type) { editRef = { mode: 'add', d: d, m: viewDate.getMonth(), y: viewDate.getFullYear(), t: type }; document.getElementById('modalTitle').innerText = "Ziua " + d; document.getElementById('evName').value = ""; document.getElementById('evDur').value = 1; document.getElementById('editModal').style.display = 'flex'; }

    function editItem(id) {
        if (id.indexOf('G_') === 0) return;
        var ev = null; for(var i=0; i<localDB.length; i++) if(localDB[i].id === id) ev = localDB[i];
        if(!ev) return;
        editRef = { mode: 'edit', id: id }; document.getElementById('modalTitle').innerText = "Editare"; document.getElementById('evName').value = ev.n; document.getElementById('evDur').value = ev.dur || 1; document.getElementById('editModal').style.display = 'flex';
    }

    document.getElementById('btnSave').onclick = function() {
        var name = document.getElementById('evName').value.trim();
        var dur = parseInt(document.getElementById('evDur').value) || 1;
        if(editRef.mode === 'add' && name) localDB.push({ id: 'L' + Date.now(), d: editRef.d, m: editRef.m, y: editRef.y, t: editRef.t, n: name, dur: dur, done: false });
        else if(editRef.mode === 'edit') { for(var i=0; i<localDB.length; i++) if(localDB[i].id === editRef.id) { if(!name) localDB.splice(i, 1); else { localDB[i].n = name; localDB[i].dur = dur; } } }
        saveAll(); closeModal(); renderCalendar();
    };

    function calLogin() {
        window.location.href = "https://accounts.google.com/o/oauth2/v2/auth?" +
            "client_id=" + GCAL_CLIENT_ID + "&redirect_uri=" + encodeURIComponent(GCAL_REDIRECT) +
            "&response_type=token&scope=" + encodeURIComponent("https://www.googleapis.com/auth/calendar.events") +
            "&prompt=select_account";
    }

    function handleGoogleCallback() {
        var p = new URLSearchParams(window.location.hash.substring(1));
        var t = p.get('access_token');
        if(t) { localStorage.setItem('gcal_token', t); window.location.hash = ""; syncGoogle(); }
    }

    function runCommand() {
        var inp = document.getElementById('cmdInput');
        var val = inp.value;
        // J1: Regex nou care suporta text inainte/dupa /c
        var m = val.match(/(.*?)\/c\s*(\d{1,2})\s*(RL|RA)?\s*(.*)/i);
        if(m) {
            var day = parseInt(m[2]);
            var type = 'c';
            if(m[3] && m[3].toUpperCase() === 'RL') type = 'm';
            if(m[3] && m[3].toUpperCase() === 'RA') type = 'a';
            var text = (m[1] + " " + m[4]).trim();
            localDB.push({ id: 'L' + Date.now(), d: day, m: viewDate.getMonth(), y: viewDate.getFullYear(), t: type, n: text, dur: 1, done: false });
            saveAll(); renderCalendar();
        }
        inp.value = "";
    }
</script>
</body>
</html>
