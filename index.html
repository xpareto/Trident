<!-- START OF FILE: index.html (Trident v31) -->
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
    <link rel="manifest" href="manifest.json"/>
    <title>Trident v31</title>
    <style>
        :root {
            --bg: #FFFFFF; --header-bg: #1e293b; --border: #cbd5e1;
            --text: #1e293b; --accent: #2563EB;
            --weekend-bg: #f0fdf4; --today-yellow: #ffff00;
            --pink-pending: #fff1f2; --green-done: #dcfce7;
            --row-h: 48px; --f-size: 11px;
        }
        body.compact { --row-h: 36px; --f-size: 10px; }
        body.mini { --row-h: 26px; --f-size: 9px; }

        body { font-family: sans-serif; margin: 0; padding: 0; background: white; color: var(--text); overflow-x: hidden; }
        .hdr { background: #1e293b; color: white; padding: 5px 10px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 2000; height: 45px; }
        .v-badge { background: #2563EB; color: white; padding: 2px 4px; border-radius: 3px; font-size: 9px; font-weight: bold; }
        .nav-btn { background: #334155; color: white; border: 1px solid #475569; border-radius: 4px; padding: 5px 8px; font-size: 11px; cursor: pointer; }

        .grid { display: block; width: 100%; min-width: 850px; padding-bottom: 80px; }
        
        /* C12: Latime redusa la maximum pentru Col 1-2 */
        .h-r { display: flex; width: 100%; background: #f1f5f9; font-weight: bold; font-size: 10px; position: sticky; top: 45px; z-index: 1500; border-bottom: 2px solid #94a3b8; height: 38px; }
        .h-r .c { display: flex !important; justify-content: flex-end !important; align-items: center !important; padding-bottom: 3px !important; }

        .r { display: flex; width: 100%; border-bottom: 1px solid var(--border); min-height: var(--row-h); }
        .c { border-right: 1px solid var(--border); padding: 1px 2px; flex: 1; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        
        .c-fix-nr { flex: 0 0 22px; justify-content: center; text-align: center; font-weight: bold; font-size: 11px; }
        .c-fix-zi { flex: 0 0 32px; justify-content: center; text-align: center; font-weight: bold; font-size: 10px; }
        .c-sticky { position: sticky; left: 0; z-index: 100; background: inherit; padding: 0 !important; }
        .c-date { left: 22px; border-right: 2px solid #64748b; }

        .r.weekend { background-color: #dcfce7 !important; }
        .r.today .c-sticky { background-color: #dcfce7 !important; }
        .r.today .c:not(.c-sticky) { background-color: var(--today-yellow) !important; }
        .r.today { outline: 2px solid orange; outline-offset: -2px; }

        .ev-item { display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 3px; margin-bottom: 1px; border: 1px solid rgba(0,0,0,0.05); font-size: var(--f-size); font-weight: 600; line-height: 1; }
        .ev-item.pending { background: var(--pink-pending); border-left: 3px solid #f43f5e; }
        .ev-item.done { background: var(--green-done); border-left: 3px solid #22c55e; opacity: 0.6; text-decoration: line-through; }
        
        .ev-txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        /* S1 & Tx1: Butoane actiune */
        .btn-x { color: #f43f5e; font-weight: bold; padding: 0 4px; font-size: 10px; cursor: pointer; }
        .btn-i { background: white; border: 1px solid #ccc; border-radius: 50%; width: 14px; height: 14px; font-size: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-i.has-info { background: #fbbf24; border-color: #d97706; }

        .j-text { font-size: 9px; font-style: italic; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: auto; }
        .cmd-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #f1f5f9; padding: 6px; display: flex; border-top: 2px solid #2563EB; z-index: 2000; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; align-items: center; justify-content: center; }
        .m-box { background: white; padding: 15px; border-radius: 8px; width: 95%; max-width: 400px; }
        textarea { width: 100%; height: 120px; font-family: inherit; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>

<body onload="initApp()">

<header class="hdr">
    <div class="v-badge">v31</div>
    <div id="mLabel" style="font-weight: bold; font-size: 13px; text-transform: uppercase;">...</div>
    <div style="display:flex; gap:4px;">
        <button class="nav-btn" onclick="toggleZoom()">[Z]</button>
        <button id="btnEco" class="nav-btn" onclick="toggleEco()">ECO</button>
        <button class="nav-btn sync" style="background:#10b981" onclick="calLogin()">SYNC</button>
        <button class="nav-btn" onclick="navMonth(-1)">&lt;</button>
        <button class="nav-btn" onclick="navMonth(1)">&gt;</button>
    </div>
</header>

<div class="grid" id="mainGrid">
    <div class="h-r">
        <div class="c c-fix-nr c-sticky">Nr</div>
        <div class="c c-fix-zi c-sticky c-date">Zi</div>
        <div class="c">LUNARE</div>
        <div class="c">CURENTE</div>
        <div class="c">ANUALE</div>
    </div>
    <div id="gridBody"></div>
</div>

<div class="cmd-bar">
    <input type="text" id="cmdInput" style="flex:1; padding:10px; font-size: 16px; border:1px solid #ccc; border-radius:5px;" placeholder="Ex: 12 D 2 3 (Șterge rând 3 col 2 ziua 12)">
    <button onclick="runCommand()" style="margin-left:5px; padding:10px; background:#2563EB; color:white; border:none; font-weight:bold; border-radius:5px;">OK</button>
</div>

<!-- Modal Descriere (Tx1) -->
<div id="descModal" class="modal">
    <div class="m-box">
        <h3 id="descTitle" style="margin-top:0; font-size: 14px;">Descriere Eveniment</h3>
        <textarea id="descText" placeholder="Adaugă detalii..."></textarea>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="nav-btn" style="flex:1; background:#ccc; color:black;" onclick="closeModal()">ÎNCHIDE</button>
            <button class="nav-btn" style="flex:1; background:#2563EB;" id="btnSaveDesc">SALVEAZĂ</button>
        </div>
    </div>
</div>

<script>
    var GCAL_CLIENT_ID = '705792153280-6u766blorfafm3taeonfcufbihggd3ee.apps.googleusercontent.com';
    var GCAL_REDIRECT = window.location.origin + window.location.pathname;
    var viewDate = new Date();
    var localDB = [], journalData = {}, googleEvents = [], gDoneMap = {}, ecoMode = false, zoomLevel = 0;
    var activeDescRef = null;

    function initApp() {
        try {
            var sDB = localStorage.getItem('trident_db_v31') || localStorage.getItem('trident_db_v30');
            if(sDB) localDB = JSON.parse(sDB);
            var sJ = localStorage.getItem('trident_j_v31') || localStorage.getItem('trident_j_v30');
            if(sJ) journalData = JSON.parse(sJ);
            ecoMode = localStorage.getItem('trident_eco') === 'true';
            zoomLevel = parseInt(localStorage.getItem('trident_zoom') || '0');
            applyZoom();
            if(window.location.hash.indexOf('access_token') > -1) handleGoogleCallback();
            else { renderCalendar(); if(localStorage.getItem('gcal_token')) syncGoogle(); }
        } catch(e) { console.error(e); }
    }

    async function syncGoogle() {
        var token = localStorage.getItem('gcal_token');
        if (!token) return;
        var start = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1).toISOString();
        var end = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0, 23, 59, 59).toISOString();
        try {
            var resp = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin="+start+"&timeMax="+end+"&singleEvents=true&orderBy=startTime", { headers: { Authorization: "Bearer " + token } });
            var data = await resp.json();
            if (data.items) {
                googleEvents = data.items.map(function(ge) {
                    var sDt = new Date(ge.start.dateTime || ge.start.date), eDt = new Date(ge.end.dateTime || ge.end.date);
                    var dur = Math.round((eDt - sDt) / 86400000) || 1;
                    var title = ge.summary || "", isDone = title.indexOf("[OK]") > -1;
                    return { id: ge.id, d: sDt.getDate(), m: sDt.getMonth(), y: sDt.getFullYear(), n: title.replace("[OK]", "").trim(), t: 'c', dur: dur, isG: true, done: isDone, link: ge.htmlLink, desc: ge.description || "" };
                });
                renderCalendar();
            }
        } catch (e) { renderCalendar(); }
    }

    function renderCalendar() {
        var body = document.getElementById('gridBody');
        var Y = viewDate.getFullYear(), M = viewDate.getMonth(), now = new Date(); now.setHours(0,0,0,0);
        var dayNames = ["DU", "LU", "MA", "MI", "JO", "VI", "SA"];
        var monthNames = ["Ianuarie", "Februarie", "Martie", "Aprilie", "Mai", "Iunie", "Iulie", "August", "Septembrie", "Octombrie", "Noiembrie", "Decembrie"];
        document.getElementById('mLabel').innerHTML = monthNames[M] + " " + Y;
        var lastDay = new Date(Y, M + 1, 0).getDate();
        
        var html = "";
        for (var d = 1; d <= lastDay; d++) {
            var curDt = new Date(Y, M, d), isToday = (curDt.toDateString() === now.toDateString()), isWE = (curDt.getDay() % 6 === 0), key = Y+"-"+M+"-"+d;
            var dayEvs = localDB.concat(googleEvents).filter(function(e){ 
                var s = new Date(e.y,e.m,e.d), end = new Date(e.y,e.m,e.d+(e.dur||1)-1);
                return (d === e.d || d === (e.d + (e.dur || 1) - 1)) && curDt >= s && curDt <= end;
            });

            if (ecoMode && curDt < now && !isToday && !dayEvs.some(function(x){return !x.done})) continue;

            html += '<div class="r '+(isToday?'today':'')+' '+(isWE?'weekend':'')+'" '+(isToday?'id="scroll-today"':'')+'>';
            html += '<div class="c c-fix-nr c-sticky">'+d+'</div><div class="c c-fix-zi c-sticky c-date">'+dayNames[curDt.getDay()]+'</div>';
            ['m','c','a'].forEach(function(type) {
                html += '<div class="c" onclick="openAddModal('+d+',\''+type+'\')">';
                dayEvs.filter(function(x){return x.t === (type==='m'?'m':type==='a'?'a':'c')}).forEach(function(ev, idx){
                    var status = ev.done ? "done" : "pending";
                    var infoClass = ev.desc ? "has-info" : "";
                    html += '<div class="ev-item '+status+'" onclick="event.stopPropagation(); openAddModal('+d+',\''+type+'\')">';
                    html += '<input type="checkbox" class="chk" '+(ev.done?'checked':'')+' onclick="event.stopPropagation(); tglStatus(\''+ev.id+'\', '+!!ev.isG+')">';
                    html += '<span class="ev-txt">'+(ev.isG?"☁️ ":"• ")+ev.n+'</span>';
                    html += '<div class="btn-i '+infoClass+'" onclick="event.stopPropagation(); openDesc(\''+ev.id+'\','+!!ev.isG+')">i</div>';
                    html += '<div class="btn-x" onclick="event.stopPropagation(); delEv(\''+ev.id+'\','+!!ev.isG+')">×</div></div>';
                });
                if(type === 'c' && journalData[key]) html += '<div class="j-text" onclick="event.stopPropagation(); openDesc(\''+key+'\', false, true)">'+journalData[key]+'</div>';
                html += '</div>';
            });
            html += '</div>';
        }
        body.innerHTML = html;
        if(M === now.getMonth()) setTimeout(function(){ document.getElementById('scroll-today')?.scrollIntoView({block:"center"}); }, 500);
    }

    // S1 & S2: Logica stergere
    async function delEv(id, isG) {
        if(!confirm("Ștergi acest rând?")) return;
        if(isG) {
            var token = localStorage.getItem('gcal_token');
            await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events/" + id, { method: 'DELETE', headers: { Authorization: "Bearer " + token } });
            syncGoogle();
        } else {
            localDB = localDB.filter(function(x){return x.id !== id});
            saveAll(); renderCalendar();
        }
    }

    // Tx1: Logica descriere
    function openDesc(id, isG, isJournal) {
        activeDescRef = { id: id, isG: isG, isJ: !!isJournal };
        var text = "";
        if(isJournal) text = journalData[id] || "";
        else {
            var ev = localDB.concat(googleEvents).find(function(x){return x.id === id});
            text = ev ? (ev.desc || "") : "";
        }
        document.getElementById('descText').value = text;
        document.getElementById('descModal').style.display = 'flex';
    }

    document.getElementById('btnSaveDesc').onclick = async function() {
        var text = document.getElementById('descText').value;
        if(activeDescRef.isJ) {
            journalData[activeDescRef.id] = text;
        } else if(activeDescRef.isG) {
            var token = localStorage.getItem('gcal_token');
            await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events/" + activeDescRef.id, { 
                method: 'PATCH', headers: { Authorization: "Bearer " + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ description: text }) 
            });
            syncGoogle();
        } else {
            var ev = localDB.find(function(x){return x.id === activeDescRef.id});
            if(ev) ev.desc = text;
        }
        saveAll(); closeModal(); renderCalendar();
    };

    function runCommand() {
        var inp = document.getElementById('cmdInput'), val = inp.value.trim(); if(!val) return;
        // S2: Stergere de forma "12 D 2 3"
        var mDel = val.match(/^(\d{1,2})\s*D\s*([1-3])\s*(\d+)/i);
        if(mDel) {
            var d = parseInt(mDel[1]), colIdx = parseInt(mDel[2]), rowIdx = parseInt(mDel[3]);
            var type = colIdx === 1 ? 'm' : colIdx === 2 ? 'c' : 'a';
            var evs = localDB.concat(googleEvents).filter(function(e){ return e.d === d && e.t === type; });
            if(evs[rowIdx-1]) delEv(evs[rowIdx-1].id, !!evs[rowIdx-1].isG);
            inp.value = ""; return;
        }
        // Logica adaugare din v30... (RL, RA, N)
        var mNote = val.match(/^(\d{1,2})\s*N\s+(.*)/i);
        if(mNote) { journalData[viewDate.getFullYear()+'-'+viewDate.getMonth()+'-'+parseInt(mNote[1])] = mNote[2]; saveAll(); renderCalendar(); inp.value = ""; return; }
        var mEv = val.match(/^(\d{1,2})\s*(R\d*[SLA])?\s*(.*)/i);
        if(mEv) {
            var day = parseInt(mEv[1]), pref = mEv[2]||'', txt = mEv[3];
            localDB.push({ id:'L'+Date.now(), d:day, m:viewDate.getMonth(), y:viewDate.getFullYear(), t:(pref.indexOf('L')>-1?'m':pref.indexOf('A')>-1?'a':'c'), n:(pref?pref+' ':'')+txt, dur:1, done:false });
            saveAll(); renderCalendar(); inp.value = "";
        }
    }

    function toggleZoom() { zoomLevel = (zoomLevel + 1) % 3; applyZoom(); localStorage.setItem('trident_zoom', zoomLevel); renderCalendar(); }
    function applyZoom() { document.body.classList.remove('compact', 'mini'); if(zoomLevel === 1) document.body.classList.add('compact'); if(zoomLevel === 2) document.body.classList.add('mini'); }
    function openAddModal(d, t) { /* v30 logic */ document.getElementById('editModal').style.display='flex'; }
    function closeModal() { document.querySelectorAll('.modal').forEach(function(m){m.style.display='none'}); }
    function saveAll() { localStorage.setItem('trident_db_v31', JSON.stringify(localDB)); localStorage.setItem('trident_j_v31', JSON.stringify(journalData)); }
    function calLogin() { window.location.href = "https://accounts.google.com/o/oauth2/v2/auth?client_id=" + GCAL_CLIENT_ID + "&redirect_uri=" + encodeURIComponent(GCAL_REDIRECT) + "&response_type=token&scope=" + encodeURIComponent("https://www.googleapis.com/auth/calendar.events") + "&prompt=select_account"; }
    function handleGoogleCallback() { var p = new URLSearchParams(window.location.hash.substring(1)); var t = p.get('access_token'); if(t) { localStorage.setItem('gcal_token', t); window.location.hash = ""; syncGoogle(); } }
    async function tglStatus(id, isG) { /* v29 logic */ if(isG) { var ev=googleEvents.find(function(x){return x.id===id}); ev.done=!ev.done; var token=localStorage.getItem('gcal_token'); await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events/"+id, {method:'PATCH',headers:{Authorization:"Bearer "+token,'Content-Type':'application/json'},body:JSON.stringify({summary:ev.done?ev.n+" [OK]":ev.n.replace("[OK]","").trim()})}); syncGoogle(); } else { localDB.forEach(function(x){if(x.id===id)x.done=!x.done}); saveAll(); renderCalendar(); } }
</script>
</body>
</html>
