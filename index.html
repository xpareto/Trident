<!-- START OF FILE: index.html (Trident v15) -->
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
    <link rel="manifest" href="manifest.json"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="theme-color" content="#FFFFFF" id="themeMeta"/>
    <title>Trident v15</title>
    <style>
        :root {
            --bg: #FFFFFF; --header-bg: #F8FAFC; --border: #E2E8F0;
            --text: #0F172A; --text-muted: #64748B; --accent: #2563EB;
            --weekend: #DCFCE7; --today-bg: #FFFF00; --today-text: #000000;
            --ev-done: #E2E8F0; --f-size: 13px;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: var(--f-size); margin: 0; padding-bottom: 70px; }
        
        /* Header solid pentru vizibilitate */
        .hdr { 
            background: #1e293b; color: white; 
            padding: 5px 10px; display: flex; align-items: center; justify-content: space-between; 
            position: sticky; top: 0; z-index: 1000; height: 50px; 
        }
        .version-badge { background: var(--accent); color: white; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 900; cursor: pointer; }
        
        .nav-group { display: flex; align-items: center; gap: 8px; }
        .nav-btn { background: #334155; color: white; border: 1px solid #475569; border-radius: 4px; padding: 6px 12px; font-size: 12px; font-weight: bold; cursor: pointer; }
        
        /* Grid definit clar */
        .grid { display: flex; flex-direction: column; width: 100%; min-width: 800px; border-top: 1px solid var(--border); }
        .r { display: grid; grid-template-columns: 45px 60px 1fr 1fr 1fr; border-bottom: 1px solid var(--border); min-height: 50px; }
        .h-r { background: #f1f5f9; font-weight: 900; font-size: 10px; position: sticky; top: 50px; z-index: 500; color: #475569; text-transform: uppercase; }

        .c { border-right: 1px solid var(--border); padding: 4px; display: flex; flex-direction: column; position: relative; }
        .c-sticky { position: sticky; background: inherit; z-index: 20; }
        .c-nrz { left: 0; text-align: center; justify-content: center; font-weight: 800; }
        .c-numez { left: 45px; text-align: center; justify-content: center; font-weight: 800; border-right: 2px solid var(--border); }

        .r.weekend { background-color: var(--weekend); }
        .r.today { background-color: var(--today-bg); border: 2px solid #f59e0b; }
        .r.today .c-sticky { background-color: var(--today-bg) !important; }

        .ev-item { display: flex; align-items: flex-start; gap: 4px; padding: 2px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 12px; word-break: break-word; }
        .journal-box { width: 100%; border: none; background: transparent; font-family: inherit; font-size: 12px; font-style: italic; resize: none; outline: none; margin-top: auto; border-top: 1px dotted #ccc; }

        /* Modale */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .m-box { background: white; padding: 20px; border-radius: 10px; width: 100%; max-width: 450px; color: black; }
        
        /* Command Bar */
        .cmd-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #f8fafc; border-top: 2px solid var(--accent); padding: 10px; display: flex; gap: 10px; z-index: 1100; }
        #cmd-input { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 16px; }
    </style>
</head>
<body onload="initApp()">

<header class="hdr">
    <div class="version-badge" onclick="openDiag()">Trident v15</div>
    <div id="mLabel" style="font-weight: 900; font-size: 14px; text-transform: uppercase;">...</div>
    <div class="nav-group">
        <button class="nav-btn" onclick="openLogs()">[LOGS]</button>
        <button class="nav-btn" style="background: #10b981;" onclick="calLogin()">SYNC</button>
        <button class="nav-btn" onclick="nav(-1)"></button>
        <button class="nav-btn" onclick="nav(1)"></button>
    </div>
</header>

<div class="grid" id="mainGrid">
    <div class="r h-r">
        <div class="c c-nrz c-sticky">NRZ</div>
        <div class="c c-numez c-sticky">NumeZ</div>
        <div class="c">LUNARE</div>
        <div class="c">CURENTE / JURNAL</div>
        <div class="c">ANUALE</div>
    </div>
    <div id="gridBody"></div>
</div>

<div class="cmd-bar">
    <input type="text" id="cmd-input" placeholder="Ex: /c15rl Pizza">
    <button class="nav-btn" style="background: var(--accent);" onclick="runCmd()">OK</button>
</div>

<!-- Modal Logs (Sistemul de Cutie Neagr) -->
<div id="logModal" class="modal">
    <div class="m-box">
        <h3>System Logs (Debug)</h3>
        <textarea id="logArea" readonly style="width:100%; height:300px; font-family: monospace; font-size: 10px; background: #f1f5f9; padding: 10px;"></textarea>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="nav-btn" style="flex:1; background:var(--accent);" onclick="copyLogs()">COPIAZ LOGS</button>
            <button class="nav-btn" style="flex:1;" onclick="closeLogs()">ÎNCHIDE</button>
        </div>
    </div>
</div>

<!-- Modal Editare -->
<div id="editModal" class="modal">
    <div class="m-box">
        <h3 id="modalTitle">Eveniment</h3>
        <input type="text" id="evName" placeholder="Nume eveniment" style="width:100%; padding:10px; margin-bottom:10px;">
        <input type="number" id="evDur" value="1" style="width:100%; padding:10px; margin-bottom:10px;">
        <div style="display:flex; gap:10px;">
            <button class="nav-btn" style="flex:1;" onclick="closeModal()">ANULARE</button>
            <button class="nav-btn" style="flex:1; background:var(--accent);" id="btnSave">SALVEAZ</button>
        </div>
    </div>
</div>

<script>

    function L(msg) {
        let entry = new Date().toISOString().slice(14,21) + " > " + msg;
        debugData.push(entry);
        console.log(entry);
    }
    function openLogs() { document.getElementById('logArea').value = debugData.join('\n'); document.getElementById('logModal').style.display = 'flex'; }
    function closeLogs() { document.getElementById('logModal').style.display = 'none'; }
    function copyLogs() {
        let area = document.getElementById('logArea');
        area.select();
        document.execCommand('copy');
        alert("Log-urile au fost copiate în Clipboard!");
    }

    // --- CONFIG ---

    const GCAL_REDIRECT = window.location.origin + window.location.pathname;

    let db = [];

            render();
            L("Render iniial terminat.");

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').then(() => L("SW înregistrat."));
            }
        } catch(e) {
            L("CRITICAL ERROR INIT: " + e.message);
            alert("Eroare la pornire! Deschide LOGS.");
        }
    }

    function nav(d) { 
        L("Navigare luna: " + d);
        vDate.setMonth(vDate.getMonth() + d); 
        render(); 
    }

            const now = new Date(); now.setHours(0,0,0,0);

            document.getElementById('mLabel').innerText = monthNames[M] + " " + Y;
            L("Lun setat: " + monthNames[M]);

            body.innerHTML = '';
            L("Zile în lun: " + daysInM);

            for (let d = 1; d <= daysInM; d++) {

                const isToday = now.toDateString() === dt.toDateString();
                const key = `${Y}-${M}-${d}`;
                const isWE = dt.getDay() === 0 || dt.getDay() === 6;

                const dayEvs = [...db, ...g_evs].filter(e => {
                    const startDt = new Date(e.y, e.m, e.d);
                    const endDt = new Date(e.y, e.m, e.d + (e.dur || 1) - 1);
                    return dt >= startDt && dt <= endDt;
                });

                const row = document.createElement('div');
                row.className = `r ${isWE ? 'weekend' : ''} ${isToday ? 'today' : ''}`;
                if(isToday) row.id = "scroll-today";

                row.innerHTML = `

                    <div class="c c-numez c-sticky">${dt.toLocaleDateString('ro-RO',{weekday:'short'}).toUpperCase().slice(0,2)}</div>
                    <div class="c" onclick="openEdit(${d}, 'm')">${drawItems(dayEvs.filter(e => e.t === 'm'))}</div>
                    <div class="c" onclick="openEdit(${d}, 'c')">
