<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
    <link rel="manifest" href="manifest.json"/>
    <title>Trident v46</title>
    <style>
        :root {
            --bg: #FFFFFF; --header-bg: #1e293b; --border: #cbd5e1;
            --text: #1e293b; --accent: #2563EB;
            --weekend-bg: #e0f2fe; --today-yellow: #ffff00;
            --pink-pending: #fff1f2; --green-done: #dcfce7;
            --row-h: 48px; --f-ev: 11px;
        }
        body.compact { --row-h: 36px; --f-ev: 10px; }
        body.mini { --row-h: 26px; --f-ev: 9px; }

        body { font-family: sans-serif; margin: 0; padding: 0; background: white; color: var(--text); overflow-x: hidden; width: 100vw; }
        .hdr { background: #1e293b; color: white; padding: 5px 10px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 2000; height: 45px; }
        .v-badge { background: #2563EB; color: white; padding: 2px 4px; border-radius: 3px; font-size: 9px; font-weight: bold; }
        .nav-btn { background: #334155; color: white; border: 1px solid #475569; border-radius: 4px; padding: 5px 8px; font-size: 11px; cursor: pointer; font-weight: bold; }

        .grid { display: block; width: 100%; min-width: 850px; padding-bottom: 80px; }
        .h-r { display: flex; width: 100%; background: #f1f5f9; font-weight: bold; font-size: 10px; position: sticky; top: 45px; z-index: 1500; border-bottom: 2px solid #94a3b8; height: 38px; }
        .h-r .c { display: flex !important; justify-content: flex-end !important; align-items: center !important; padding-bottom: 3px !important; flex-direction: column; }

        .r { display: flex; width: 100%; border-bottom: 1px solid var(--border); min-height: var(--row-h); background: white; }
        .c { border-right: 1px solid var(--border); padding: 1px 2px; flex: 1; overflow: hidden; display: flex; flex-direction: column; position: relative; min-width: 0; }
        
        .c-fix-nr { flex: 0 0 24px; justify-content: center; text-align: center; font-weight: bold; font-size: 11px; }
        .c-fix-zi { flex: 0 0 32px; justify-content: center; text-align: center; font-weight: bold; font-size: 10px; }
        .c-sticky { position: sticky; left: 0; z-index: 100; background: inherit; }
        .c-date { left: 24px; border-right: 2px solid #64748b; }

        .r.weekend { background-color: var(--weekend-bg) !important; }
        .r.today { background-color: var(--today-yellow) !important; outline: 2px solid orange; outline-offset: -2px; }
        .r.today .c-sticky { background-color: var(--today-yellow) !important; }

        .ev-item { display: flex; align-items: center; gap: 3px; padding: 2px; border-radius: 3px; margin-bottom: 1px; border: 1px solid rgba(0,0,0,0.05); font-size: var(--f-ev); font-weight: 600; line-height: 1.1; cursor: pointer; }
        .ev-item.pending { background: var(--pink-pending); border-left: 3px solid #f43f5e; }
        .ev-item.done { background: var(--green-done); border-left: 3px solid #22c55e; opacity: 0.6; text-decoration: line-through; }
        
        .ev-txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .btn-x { color: #f43f5e; font-weight: bold; padding: 0 4px; font-size: 12px; cursor: pointer; flex-shrink: 0; }
        .btn-i { background: white; border: 1px solid #ccc; border-radius: 50%; width: 14px; height: 14px; font-size: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .btn-i.has-info { background: #fbbf24; border-color: #d97706; }

        .j-row { display: flex; align-items: center; gap: 4px; margin-top: auto; padding-top: 2px; border-top: 1px dotted #ccc; }
        .j-text { font-size: 9px; font-style: italic; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        
        .cmd-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #f1f5f9; padding: 6px; display: flex; border-top: 2px solid #2563EB; z-index: 2000; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; align-items: center; justify-content: center; padding: 15px; }
        .m-box { background: white; padding: 15px; border-radius: 8px; width: 95%; max-width: 400px; color: black; }
        textarea { width: 100%; height: 120px; font-family: inherit; margin-top: 10px; border: 1px solid #ccc; border-radius: 5px; padding: 8px; }
    </style>
</head>

<body onload="initApp()">

<header class="hdr">
    <div class="v-badge" onclick="location.reload()">v46</div>
    <div id="mLabel" style="font-weight: bold; font-size: 13px; text-transform: uppercase;">...</div>
    <div style="display:flex; gap:4px;">
        <button class="nav-btn" onclick="toggleZoom()">[Z]</button>
        <button id="btnEco" class="nav-btn" onclick="toggleEco()">ECO</button>
        <button class="nav-btn sync" style="background:#10b981" onclick="calLogin()">SYNC</button>
        <button class="nav-btn" onclick="navMonth(-1)">&lt;</button>
        <button class="nav-btn" onclick="navMonth(1)">&gt;</button>
    </div>
</header>

<div id="overdueZone" style="display:none; background:#fee2e2; border:2px solid #ef4444; margin:5px; padding:8px; border-radius:8px;">
    <div style="color:#b91c1c; font-weight:900; font-size:10px; text-transform:uppercase;">Restanțe</div>
    <div id="overdueContent"></div>
</div>

<div class="grid" id="mainGrid">
    <div class="h-r">
        <div class="c c-fix-nr c-sticky">Nr</div>
        <div class="c c-fix-zi c-sticky c-date">Zi</div>
        <div class="c">LUNARE</div>
        <div class="c">CURENTE</div>
        <div class="c">ANUALE</div>
    </div>
    <div id="gridBody"></div>
</div>

<div class="cmd-bar">
    <input type="text" id="cmdInput" style="flex:1; padding:10px; font-size: 16px; border:1px solid #ccc; border-radius:5px;" placeholder="15RLPizza | 12D21 | 15NNota">
    <button onclick="runCommand()" style="margin-left:5px; padding:10px; background:#2563EB; color:white; border:none; font-weight:bold; border-radius:5px;">OK</button>
</div>

<!-- Modale -->
<div id="descModal" class="modal"><div class="m-box"><h3 style="font-size:14px;margin:0;">Informații</h3><textarea id="descText"></textarea><div style="display:flex;gap:10px;margin-top:15px;"><button class="nav-btn" style="flex:1;background:#ccc;color:black;" onclick="closeModal()">ÎNCHIDE</button><button class="nav-btn" style="flex:1;background:#2563EB;" id="btnSaveDesc">SALVEAZĂ</button></div></div></div>
<div id="editModal" class="modal"><div class="m-box"><h3 id="modalTitle">Nou</h3><input type="text" id="evName" placeholder="Nume" style="width:100%;padding:10px;border:1px solid #ccc;"><input type="number" id="evDur" value="1" style="width:100%;padding:10px;margin-top:10px;border:1px solid #ccc;"><div style="display:flex;gap:10px;margin-top:15px;"><button class="nav-btn" style="flex:1;background:#ccc;color:black;" onclick="closeModal()">ANULARE</button><button class="nav-btn" style="flex:1;background:var(--accent);" id="btnSave">SALVEAZĂ</button></div></div></div>

<script>
    var GCAL_CLIENT_ID = '705792153280-6u766blorfafm3taeonfcufbihggd3ee.apps.googleusercontent.com';
    var GCAL_REDIRECT = window.location.origin + window.location.pathname;
    
    var viewDate = new Date();
    var localDB = [], journalData = {}, googleEvents = [], ecoMode = false, zoomLevel = 0, editRef = null, activeDescRef = null;

    function initApp() {
        try {
            // Incarcam tot din v46 sau fallback pe orice gasim
            var v = "v46";
            localDB = JSON.parse(localStorage.getItem('trident_db_'+v) || localStorage.getItem('trident_db_v40') || '[]');
            journalData = JSON.parse(localStorage.getItem('trident_j_'+v) || localStorage.getItem('trident_j_v40') || '{}');
            ecoMode = localStorage.getItem('trident_eco') === 'true';
            zoomLevel = parseInt(localStorage.getItem('trident_zoom') || '0');
            applyZoom();

            renderCalendar(); 
            if(window.location.hash.indexOf('access_token') > -1) handleGoogleCallback();
            else if(localStorage.getItem('gcal_token')) syncGoogle();
        } catch(e) { renderCalendar(); }
    }

    function getCategory(text, rrule) {
        var s = (text || "").toUpperCase().trim();
        if (/^R\d*L/.test(s) || (rrule && rrule.indexOf('MONTHLY') > -1)) return 'm';
        if (/^RA/.test(s) || /^R\d*A/.test(s) || /SF\.|SFANT|SFÂNT|ZI |ZIUA |ZILE |NUNTA|CUNUNIE|BOTEZ|ORTODOX|CATOLIC|ADORMIREA/.test(s) || (rrule && rrule.indexOf('YEARLY') > -1)) return 'a';
        return 'c';
    }

    async function syncGoogle() {
        var token = localStorage.getItem('gcal_token'); if (!token) return;
        var start = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1).toISOString();
        var end = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0, 23, 59, 59).toISOString();
        try {
            var r1 = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin="+start+"&timeMax="+end+"&singleEvents=true&orderBy=startTime", { headers: { Authorization: "Bearer " + token } });
            var d1 = await r1.json();
            var r2 = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=false", { headers: { Authorization: "Bearer " + token } });
            var d2 = await r2.json();
            var masterMap = {};
            if(d2.items) {
                for(var i=0; i<d2.items.length; i++) {
                    var m = d2.items[i];
                    if(m.recurrence) masterMap[m.id] = m.recurrence[0];
                }
            }
            if (d1.items) {
                googleEvents = [];
                for(var j=0; j<d1.items.length; j++) {
                    var ge = d1.items[j];
                    var s = new Date(ge.start.dateTime || ge.start.date), e = new Date(ge.end.dateTime || ge.end.date);
                    var dur = Math.round((e - s) / 86400000) || 1;
                    var title = ge.summary || "", done = title.indexOf("[OK]") > -1;
                    var type = getCategory(title, masterMap[ge.recurringEventId] || (ge.recurrence ? ge.recurrence[0] : null));
                    googleEvents.push({ id: ge.id, d: s.getDate(), m: s.getMonth(), y: s.getFullYear(), n: title.replace("[OK]", "").trim(), t: type, dur: dur, isG: true, done: done, link: ge.htmlLink, desc: ge.description || "" });
                }
                renderCalendar();
            }
        } catch (e) { renderCalendar(); }
    }

    function renderCalendar() {
        var body = document.getElementById('gridBody'); if(!body) return;
        var Y = viewDate.getFullYear(), M = viewDate.getMonth(), now = new Date(); now.setHours(0,0,0,0);
        var months = ["Ianuarie", "Februarie", "Martie", "Aprilie", "Mai", "Iunie", "Iulie", "August", "Septembrie", "Octombrie", "Noiembrie", "Decembrie"];
        var daysArr = ["DU", "LU", "MA", "MI", "JO", "VI", "SA"];
        document.getElementById('mLabel').innerHTML = months[M] + " " + Y;
        var lastDay = new Date(Y, M + 1, 0).getDate();
        
        var firstBad = 1;
        if(ecoMode && M === now.getMonth()) {
            for(var i=1; i<=lastDay; i++) {
                var k = Y+"-"+M+"-"+i;
                var hasRed = localDB.concat(googleEvents).some(function(e){
                    var s = new Date(e.y,e.m,e.d), end = new Date(e.y,e.m,e.d+(e.dur||1)-1);
                    return (i===e.d || i===(e.d+(e.dur||1)-1)) && (new Date(Y,M,i) >= s && new Date(Y,M,i) <= end) && !e.done;
                });
                if(hasRed || journalData[k] || i === now.getDate()) { firstBad = i; break; }
            }
        }

        var html = "";
        for (var d = 1; d <= lastDay; d++) {
            if (ecoMode && d < firstBad) continue;
            var dt = new Date(Y, M, d), isToday = (dt.toDateString() === now.toDateString()), isWE = (dt.getDay() % 6 === 0), key = Y+"-"+M+"-"+d;
            var dayEvs = localDB.concat(googleEvents).filter(function(ev){ 
                var s = new Date(ev.y, ev.m, ev.d), end = new Date(ev.y, ev.m, ev.d + (ev.dur || 1) - 1);
                return (d === ev.d || d === (ev.d + ev.dur - 1)) && dt >= s && dt <= end;
            });
            var rCls = "r" + (isToday ? " today" : "") + (isWE ? " weekend" : "");
            html += '<div class="'+rCls+'" '+(isToday?'id="scroll-today"':'')+'>';
            html += '<div class="c c-fix-nr c-sticky">'+d+'</div><div class="c c-fix-zi c-sticky c-date">'+daysArr[dt.getDay()]+'</div>';
            ['m','c','a'].forEach(function(type) {
                html += '<div class="c" onclick="openAddModal('+d+',\''+type+'\')">';
                dayEvs.filter(function(x){return x.t === type}).forEach(function(ev){
                    var disp = ev.n; if(ev.dur > 1) disp = (d === ev.d) ? "(1:"+ev.dur+") "+ev.n : "<b>FINAL</b> "+ev.n;
                    html += '<div class="ev-item '+(ev.done?'done':'pending')+'" onclick="event.stopPropagation(); openAddModal('+d+',\''+type+'\')">';
                    html += '<input type="checkbox" class="chk" '+(ev.done?'checked':'')+' onclick="event.stopPropagation(); tglStatus(\''+ev.id+'\', '+!!ev.isG+')">';
                    html += '<span class="ev-txt">'+(ev.isG?"☁️ ":"• ")+disp+'</span>';
                    html += '<div class="btn-i '+(ev.desc?'has-info':'')+'" onclick="event.stopPropagation(); openDesc(\''+ev.id+'\','+!!ev.isG+')">i</div>';
                    html += '<div class="btn-x" onclick="event.stopPropagation(); delEv(\''+ev.id+'\','+!!ev.isG+')">×</div></div>';
                });
                if(type === 'c' && journalData[key]) {
                    html += '<div class="j-row"><div class="j-text">'+journalData[key]+'</div><div class="btn-i has-info" onclick="event.stopPropagation(); openDesc(\''+key+'\', false, true)">i</div></div>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        body.innerHTML = html;
        if(M === now.getMonth()) setTimeout(function(){ document.getElementById('scroll-today')?.scrollIntoView({block:"center"}); }, 500);
    }

    async function runCommand() {
        var inp = document.getElementById('cmdInput'), val = inp.value.trim(); if(!val) return;
        var mDel = val.match(/^(\d{1,2})D([1-3])(\d+)/i);
        if(mDel) {
            var d = parseInt(mDel[1]), cI = parseInt(mDel[2]), rI = parseInt(mDel[3]);
            var type = cI === 1 ? 'm' : cI === 2 ? 'c' : 'a';
            var dayEvs = localDB.concat(googleEvents).filter(function(e){ return e.d === d && e.t === type; });
            if(dayEvs[rI-1]) delEv(dayEvs[rI-1].id, !!dayEvs[rI-1].isG);
            inp.value = ""; return;
        }
        var mNote = val.match(/^(\d{1,2})N(.*)/i);
        if(mNote) { journalData[viewDate.getFullYear()+'-'+viewDate.getMonth()+'-'+parseInt(mNote[1])] = mNote[2].trim(); saveAll(); renderCalendar(); inp.value = ""; return; }
        var mEvRec = val.match(/^(\d{1,2})(RL|RA)(.*)/i);
        if(mEvRec) {
            var d = parseInt(mEvRec[1]), freq = mEvRec[2].toUpperCase(), txt = mEvRec[3].trim();
            var body = { summary: txt, start: { date: viewDate.getFullYear()+"-"+String(viewDate.getMonth()+1).padStart(2,'0')+"-"+String(d).padStart(2,'0') }, end: { date: viewDate.getFullYear()+"-"+String(viewDate.getMonth()+1).padStart(2,'0')+"-"+String(d).padStart(2,'0') }, recurrence: ["RRULE:FREQ=" + (freq==='RL'?'MONTHLY':'YEARLY')] };
            var tk = localStorage.getItem('gcal_token');
            if(tk) await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", { method:'POST', headers:{Authorization:"Bearer "+tk,'Content-Type':'application/json'}, body:JSON.stringify(body) });
            syncGoogle(); inp.value = ""; return;
        }
        var mEv = val.match(/^(\d{1,2})(.*)/i);
        if(mEv) { var d = parseInt(mEv[1]), tx = mEv[2].trim(); localDB.push({ id:'L'+Date.now(), d:d, m:viewDate.getMonth(), y:viewDate.getFullYear(), t:getCategory(tx), n:tx, dur:1, done:false }); saveAll(); renderCalendar(); inp.value = ""; }
    }

    async function tglStatus(id, isG) { 
        var ev = localDB.concat(googleEvents).find(function(x){return x.id === id}); if(!ev) return;
        if(isG){ ev.done=!ev.done; var tk=localStorage.getItem('gcal_token'); await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events/"+id,{method:'PATCH',headers:{Authorization:"Bearer "+tk,'Content-Type':'application/json'},body:JSON.stringify({summary:ev.done?ev.n+" [OK]":ev.n.replace("[OK]","").trim()})}); syncGoogle(); } 
        else { ev.done=!ev.done; saveAll(); renderCalendar(); }
    }
    async function delEv(id, isG) { var ev=localDB.concat(googleEvents).find(function(x){return x.id===id}); if(!ev||!confirm("Ștergi: "+ev.n+"?"))return; if(isG){ var tk=localStorage.getItem('gcal_token'); await fetch("https://www.googleapis.com/calendar/v3/calendars/
