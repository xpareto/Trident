<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
    <link rel="manifest" href="manifest.json"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="theme-color" content="#FFFFFF" id="themeMeta"/>
    <title>Trident v5</title>
    <style>
        :root {
            --bg: #FFFFFF;
            --header-bg: #F8FAFC;
            --border: #E2E8F0;
            --text: #0F172A;
            --text-muted: #64748B;
            --accent: #2563EB;
            --weekend: #DCFCE7; 
            --today-bg: #FFFF00; 
            --today-text: #000000;
            --ev-done: #E2E8F0;
            --f-size: 13px;
        }

        body.night-mode {
            --bg: #0F1117;
            --header-bg: #1A1D2E;
            --border: #2D3048;
            --text: #E2E8F0;
            --weekend: #064E3B;
            --today-bg: #858500;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: var(--f-size); transition: 0.3s; padding-bottom: 70px; overflow-x: hidden; }

        .hdr { 
            background: var(--header-bg); border-bottom: 1px solid var(--border); 
            padding: 4px 8px; display: flex; align-items: center; justify-content: space-between; 
            position: sticky; top: 0; z-index: 1000; height: 50px; 
        }
        .version-badge { background: var(--accent); color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 900; }

        .nav-group { display: flex; align-items: center; gap: 5px; }
        .nav-btn { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; font-size: 11px; font-weight: bold; cursor: pointer; color: var(--accent); }
        .nav-btn.active { background: var(--accent); color: white; }

        .grid { display: flex; flex-direction: column; width: 100%; min-width: 800px; }
        .r { 
            display: grid; 
            grid-template-columns: 40px 55px 1fr 1fr 1fr; 
            border-bottom: 1px solid var(--border); background: var(--bg); position: relative; 
        }

        .h-r { 
            background: var(--header-bg); font-size: 9px; font-weight: 900; 
            position: sticky; top: 50px; z-index: 500; color: var(--text-muted); text-transform: uppercase; 
        }

        .c { border-right: 1px solid var(--border); min-height: 48px; display: flex; flex-direction: column; position: relative; padding: 2px; overflow: hidden; }
        
        .c-sticky { position: sticky; background: inherit; z-index: 20; }
        .c-nrz { left: 0; text-align: center; justify-content: center; font-weight: 800; }
        .c-numez { left: 40px; text-align: center; justify-content: center; font-weight: 800; border-right: 2px solid var(--border); font-size: 0.85em; }

        .r.weekend { background-color: var(--weekend); }
        .r.today .c-sticky { background-color: var(--today-bg) !important; color: var(--today-text) !important; }

        .ev-item { 
            display: flex; align-items: flex-start; gap: 4px; padding: 3px; 
            border-bottom: 1px solid var(--border); font-weight: 600; line-height: 1.2; font-size: 0.95em; 
            white-space: normal; word-break: break-word; 
        }
        .ev-item.done { opacity: 0.5; text-decoration: line-through; }
        .chk { width: 16px; height: 16px; margin-top: 1px; flex-shrink: 0; }
        
        .journal-box { 
            width: 100%; border: none; background: transparent; font-family: inherit; 
            font-size: 0.9em; font-style: italic; resize: none; outline: none; color: var(--text); 
            margin-top: auto; border-top: 1px dotted var(--border); padding-top: 2px;
        }

        .tap-area { flex-grow: 1; min-height: 20px; cursor: cell; }

        #modal, #setModal { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); 
            z-index: 2000; align-items: center; justify-content: center; padding: 15px;
        }
        .m-box { background: var(--bg); padding: 20px; border-radius: 12px; width: 100%; max-width: 340px; }

        .cmd-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--header-bg); border-top: 2px solid var(--accent); padding: 8px; display: flex; gap: 8px; z-index: 1100; }
        #cmd-input { flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 16px; outline: none; background: var(--bg); color: var(--text); }
    </style>
</head>
<body onload="initApp()">

<header class="hdr">
    <div><span class="version-badge">Trident v5</span></div>
    <div class="nav-group">
        <button class="nav-btn" id="btnEco" onclick="toggleEco()">ECONOM</button>
        <button class="nav-btn" style="background:#10b981; color:white; border:none;" onclick="calLogin()">SYNC</button>
        <button class="nav-btn" onclick="nav(-1)">‹</button>
        <div id="mLabel" style="font-weight: 800; font-size: 12px; min-width: 100px; text-align: center;">...</div>
        <button class="nav-btn" onclick="nav(1)">›</button>
        <button class="nav-btn" onclick="openSet()">⚙️</button>
    </div>
</header>

<div class="grid" id="mainGrid">
    <div class="r h-r">
        <div class="c c-nrz c-sticky">NRZ</div>
        <div class="c c-numez c-sticky">NumeZ</div>
        <div class="c">LUNARE</div>
        <div class="c">CURENTE / JURNAL</div>
        <div class="c">ANUALE</div>
    </div>
    <div id="gridBody"></div>
</div>

<div class="cmd-bar">
    <input type="text" id="cmd-input" placeholder="Comandă: /c15rl Pizza">
    <button onclick="runCmd()" style="padding:0 15px; background:var(--accent); color:white; border:none; border-radius:6px; font-weight:bold;">OK</button>
</div>

<!-- Modal Editare -->
<div id="modal">
    <div class="m-box">
        <h3 id="modalTitle" style="font-size: 14px; margin-bottom:15px;">DETALII EVENIMENT</h3>
        <input type="text" id="evName" placeholder="Nume..." style="width:100%; padding:10px; margin-bottom:10px; border:1px solid var(--border);">
        <input type="number" id="evDur" value="1" min="1" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid var(--border);">
        <div style="display:flex; gap:10px;">
            <button class="nav-btn" style="flex:1; background:#ccc; color:black; height:40px;" onclick="closeModal()">ANULARE</button>
            <button class="nav-btn" style="flex:1; background:var(--accent); color:white; height:40px;" id="btnSave">SALVEAZĂ</button>
        </div>
    </div>
</div>

<!-- Modal Setari -->
<div id="setModal">
    <div class="m-box">
        <button class="nav-btn" style="width:100%; margin-bottom:10px; height:40px;" onclick="exportJSON()">Export Backup</button>
        <button class="nav-btn" style="width:100%; background:var(--accent); color:white; height:40px;" onclick="closeSet()">ÎNCHIDE</button>
    </div>
</div>
