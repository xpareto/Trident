<!DOCTYPE html>

    <style>
        :root {
            --bg: #FFFFFF; --header-bg: #1e293b; --border: #cbd5e1;
            --text: #1e293b; --accent: #2563EB;
            --weekend-bg: #e0f2fe; --today-yellow: #ffff00;
            --pink-pending: #fff1f2; --green-done: #dcfce7;
            --row-h: 50px; --f-size: 11px;
        }
        body.compact { --row-h: 38px; --f-size: 10px; }
        body.mini { --row-h: 28px; --f-size: 9px; }

        body { font-family: sans-serif; margin: 0; padding: 0; background: white; color: var(--text); overflow-x: hidden; width: 100vw; }
        .hdr { background: #1e293b; color: white; padding: 5px 10px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 2000; height: 45px; }
        .v-badge { background: #2563EB; color: white; padding: 2px 4px; border-radius: 3px; font-size: 9px; font-weight: bold; }
        .nav-btn { background: #334155; color: white; border: 1px solid #475569; border-radius: 4px; padding: 5px 8px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .nav-btn.eco-active { background: #16a34a; border-color: #15803d; }
        .nav-btn.eco-inactive { background: #6b7280; border-color: #4b5563; }

        .grid { display: block; width: 100%; min-width: 850px; padding-bottom: 80px; }
        .h-r { display: flex; width: 100%; background: #f1f5f9; font-weight: bold; font-size: 10px; position: sticky; top: 45px; z-index: 1500; border-bottom: 2px solid #94a3b8; height: 38px; }
        .h-r .c { display: flex !important; justify-content: flex-end !important; align-items: center !important; padding-bottom: 3px !important; flex-direction: column; }

        .r { display: flex; width: 100%; border-bottom: 1px solid var(--border); min-height: var(--row-h); }
        .c { border-right: 1px solid var(--border); padding: 1px 2px; flex: 1; overflow: hidden; display: flex; flex-direction: column; position: relative; min-width: 0; }
        
        .c-fix-nr { flex: 0 0 24px; justify-content: center; text-align: center; font-weight: bold; font-size: 11px; }
        .c-fix-zi { flex: 0 0 32px; justify-content: center; text-align: center; font-weight: bold; font-size: 10px; }
        .ev-txt { word-break: break-word; }
        .c-sticky { position: sticky; left: 0; z-index: 100; background: inherit; }
        .c-date { left: 24px; border-right: 2px solid #64748b; }

        .r.weekend { background-color: var(--weekend-bg) !important; }
        .r.today { background-color: var(--today-yellow) !important; outline: 2px solid orange; outline-offset: -2px; }
        .r.today .c-sticky { background-color: var(--today-yellow) !important; }

        .ev-item { display: flex; align-items: center; gap: 3px; padding: 2px; border-radius: 3px; margin-bottom: 1px; border: 1px solid rgba(0,0,0,0.05); font-size: var(--f-size); font-weight: 600; line-height: 1.1; cursor: pointer; }
        .ev-item.pending { background: var(--pink-pending); border-left: 3px solid #f43f5e; }
        .ev-item.done { background: var(--green-done); border-left: 3px solid #22c55e; opacity: 0.6; text-decoration: line-through; }
        
        .ev-txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chk { width: 12px; height: 12px; margin: 0; flex-shrink: 0; }
        .btn-x { color: #f43f5e; font-weight: bold; padding: 0 3px; font-size: 11px; cursor: pointer; flex-shrink: 0; }
        .btn-i { background: white; border: 1px solid #ccc; border-radius: 50%; width: 12px; height: 12px; font-size: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .btn-i.has-info { background: #fbbf24; border-color: #d97706; }
        .btn-link { background: #e0f2fe; border: 1px solid #7dd3fc; border-radius: 50%; width: 12px; height: 12px; font-size: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

        .j-item { display: flex; align-items: center; gap: 3px; margin-top: auto; padding-top: 2px; border-top: 1px dotted #ccc; }
        .j-text { font-size: 9px; font-style: italic; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        
        .cmd-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #f1f5f9; padding: 6px; display: flex; border-top: 2px solid #2563EB; z-index: 2000; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; align-items: center; justify-content: center; padding: 15px; }
        .m-box { background: white; padding: 15px; border-radius: 8px; width: 95%; max-width: 400px; color: black; }
        .m-box-lg { width: 95%; max-width: 700px; height: 80vh; display: flex; flex-direction: column; }
        .m-box-lg textarea { flex: 1; height: auto; font-size: 15px; }
        textarea { width: 100%; height: 120px; font-family: inherit; margin-top: 10px; border: 1px solid #ccc; border-radius: 5px; padding: 8px; }
    </style>

<script>
    var GCAL_CLIENT_ID = '705792153280-6u766blorfafm3taeonfcufbihggd3ee.apps.googleusercontent.com';
    var GCAL_REDIRECT = window.location.origin + window.location.pathname;
    var viewDate = new Date(), localDB = [], journalData = {}, googleEvents = [], ecoMode = false, zoomLevel = 0, editRef = null, activeDescRef = null, debugLog = [];

    // Wrapper peste toate apelurile catre Google: daca sesiunea a expirat (401), explica clar userului ce sa faca
    var lastAuthAlertTs = 0;
    async function gcalFetch(url, options) {
        var r = await fetch(url, options);
        if (r.status === 401) {
            logDbg('gcalFetch: 401 — sesiunea Google a expirat, la '+url.split('?')[0]);
            var now = Date.now();
            if (now - lastAuthAlertTs > 5000) {
                lastAuthAlertTs = now;
                alert('Sesiunea Google a expirat.\n\nToken-ul de acces e valabil doar aproximativ 1 oră — e normal să expire din când în când, nu ai pierdut nimic din datele tale.\n\nApasă butonul SYNC din antet ca să te reconectezi, apoi încearcă din nou.');
            }
        }
        return r;
    }

    function logDbg(msg) {
        var t = new Date().toLocaleTimeString();
        debugLog.push(t + ' - ' + msg);
        if (debugLog.length > 300) debugLog.shift();
        var el = document.getElementById('dbgText');
        if (el && document.getElementById('dbgPanel').style.display !== 'none') { el.value = debugLog.join('\n'); el.scrollTop = el.scrollHeight; }
    }
    function toggleDbgPanel() {
        var p = document.getElementById('dbgPanel');
        if (p.style.display === 'none') { p.style.display = 'flex'; document.getElementById('dbgText').value = debugLog.join('\n'); }
        else p.style.display = 'none';
    }
    function copyDbgLog() {
        var txt = debugLog.join('\n');
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(txt).then(function(){ alert('Copiat! Lipește-l în chat.'); });
        } else {
            var el = document.getElementById('dbgText'); el.select(); document.execCommand('copy');
            alert('Copiat (metoda veche)! Lipește-l în chat.');
        }
    }

    function initApp() {
        try {
            localDB = JSON.parse(localStorage.getItem('trident_db_v49') || localStorage.getItem('trident_db_v48') || localStorage.getItem('trident_db_v47') || localStorage.getItem('trident_db_v46') || '[]');
            journalData = JSON.parse(localStorage.getItem('trident_j_v49') || localStorage.getItem('trident_j_v48') || localStorage.getItem('trident_j_v47') || localStorage.getItem('trident_j_v46') || '{}');
            // migrare: notele vechi erau text simplu, acum sunt {n:text, gid:null|idGoogle}
            Object.keys(journalData).forEach(function(k) { if (typeof journalData[k] === 'string') journalData[k] = { n: journalData[k], gid: null }; });
            ecoMode = localStorage.getItem('trident_eco') === 'true';
            zoomLevel = parseInt(localStorage.getItem('trident_zoom') || '0');
            applyZoom();
            applyEcoStyle();
            if(window.location.hash.indexOf('access_token') > -1) handleGoogleCallback();
            else { renderCalendar(); if(localStorage.getItem('gcal_token')) syncGoogle(); }
        } catch(e) { console.error(e); }
    }

    // C1: Detector prioritizat (Cununie/Nunta la Anuale)
    function getCategory(text, rrule) {
        var s = (text || "").toUpperCase().trim();
        if (/^R\d*L/.test(s)) return 'm';
        if (/^R\d*S/.test(s) || /^RS/.test(s)) return 'c';
        // RA1: Cununie si Nunta fortate la ANUALE
        if (/^RA/.test(s) || /^R\d*A/.test(s) || /SF\.|SFÂNT|SFANT|ZI |ZIUA |ZILE |NUNTA|CUNUNIE|BOTEZ|ORTODOX|CATOLIC|ADORMIREA/.test(s)) return 'a';
        if (rrule) {
            if (rrule.indexOf('MONTHLY') > -1) return 'm';
            if (rrule.indexOf('YEARLY') > -1) return 'a';
        }
        return 'c';
    }

    async function syncGoogle() {
        var token = localStorage.getItem('gcal_token');
        if (!token) { logDbg('syncGoogle: NU există token Google salvat — nu se face nimic. Apasă SYNC și autentifică-te din nou.'); return; }
        // start extins cu o luna in urma, ca sa putem detecta restantele (sarcini nebifate) din luna precedenta
        var start = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1).toISOString();
        var end = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0, 23, 59, 59).toISOString();
        logDbg('syncGoogle: pornit, interval '+start+' → '+end);
        try {
            // PAS 1: aparitiile (instances) lunii curente + luna precedenta (pentru restante) - pentru afisare pe zile
            var r = await gcalFetch("https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin="+start+"&timeMax="+end+"&singleEvents=true&orderBy=startTime", { headers: { Authorization: "Bearer " + token } });
            var d = await r.json();
            logDbg('syncGoogle: raspuns HTTP '+r.status+', '+(d.items?d.items.length:0)+' instante primite'+(d.error?(' — EROARE API: '+JSON.stringify(d.error)):''));
            if (d.items) {
                // PAS 2: evenimentele "master" (recurente) - singurul loc unde exista campul recurrence/RRULE real
                var rM = await gcalFetch("https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin="+start+"&timeMax="+end+"&singleEvents=false", { headers: { Authorization: "Bearer " + token } });
                var dM = await rM.json();
                var rruleMap = {};
                (dM.items || []).forEach(function(me) { if (me.recurrence) rruleMap[me.id] = me.recurrence[0]; });

                var noteCount = 0;
                googleEvents = d.items.filter(function(ge) {
                    var title0 = ge.summary || "";
                    if (title0.indexOf('📝 ') === 0) {
                        // e o NOTA de jurnal (creata de Trident), nu un eveniment obisnuit - o punem in journalData, nu in grila
                        var sDt0 = new Date(ge.start.dateTime || ge.start.date);
                        var jKey = sDt0.getFullYear()+'-'+sDt0.getMonth()+'-'+sDt0.getDate();
                        journalData[jKey] = { n: title0.slice(2).trim(), gid: ge.id };
                        noteCount++;
                        return false;
                    }
                    return true;
                }).map(function(ge) {
                    var sDt = new Date(ge.start.dateTime || ge.start.date), eDt = new Date(ge.end.dateTime || ge.end.date);
                    var dur = Math.round((eDt - sDt) / 86400000) || 1;
                    var title = ge.summary || "", isDone = title.indexOf("[OK]") > -1;
                    var link = ge.htmlLink || ('https://www.google.com/calendar/event?eid=' + ge.id);
                    // RRULE real: fie de pe evenimentul insusi (daca e chiar master-ul), fie preluat de la parintele lui (recurringEventId)
                    var realRrule = (ge.recurrence && ge.recurrence[0]) || rruleMap[ge.recurringEventId] || null;
                    return { id: ge.id, d: sDt.getDate(), m: sDt.getMonth(), y: sDt.getFullYear(), n: title.replace("[OK]", "").trim(), t: getCategory(title, realRrule), dur: dur, isG: true, done: isDone, link: link, desc: ge.description || "" };
                });
                if (noteCount) logDbg('syncGoogle: '+noteCount+' note de jurnal găsite printre evenimente.');
                saveAll();
                renderCalendar();
            }
        } catch (e) { logDbg('syncGoogle: EXCEPȚIE — '+e.message); renderCalendar(); }
    }

    // Creeaza un eveniment REAL recurent direct in Google Calendar (RRULE), ca sa apara automat in toate lunile viitoare
    async function addRecurringToGoogle(day, m, y, name, freq, interval) {
        var tk = localStorage.getItem('gcal_token');
        var dateStr = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
        var body = { summary: name, start: { date: dateStr }, end: { date: dateStr }, recurrence: ['RRULE:FREQ=' + freq + ';INTERVAL=' + interval] };
        await gcalFetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", { method: 'POST', headers: { Authorization: "Bearer " + tk, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        syncGoogle();
    }

    // Calculeaza o data plecand de la 'base', adaugand n unitati: Z=zile(implicit), S=saptamani, L=luni
    function relDate(base, n, u) {
        var d = new Date(base);
        u = (u || 'Z').toUpperCase();
        if (u === 'S') d.setDate(d.getDate() + n * 7);
        else if (u === 'L') d.setMonth(d.getMonth() + n);
        else d.setDate(d.getDate() + n);
        return d;
    }

    // Prescurtari stil taskwarrior: som/eom (inceput/sfarsit de luna), sow/eow (saptamana, sow=luni), soy/eoy (an)
    // B (begin) e alias pentru S (start) - bom=som, bow=sow, boy=soy - ambele acceptate
    // Calculate relativ la 'refDate' (implicit: azi, sau data rezultata din partea stanga a unui interval)
    function resolveToken(tok, refDate) {
        tok = tok.toLowerCase().replace(/^b/, 's'); // bom/bow/boy -> som/sow/soy
        if (tok === 'som') return new Date(refDate.getFullYear(), refDate.getMonth(), 1);
        if (tok === 'eom') return new Date(refDate.getFullYear(), refDate.getMonth() + 1, 0);
        if (tok === 'soy') return new Date(refDate.getFullYear(), 0, 1);
        if (tok === 'eoy') return new Date(refDate.getFullYear(), 11, 31);
        if (tok === 'sow' || tok === 'eow') {
            var day0 = refDate.getDay(); // 0=Duminica ... sow=LUNI
            var diffToMon = (day0 === 0 ? -6 : 1 - day0);
            var mon = new Date(refDate); mon.setDate(refDate.getDate() + diffToMon);
            if (tok === 'sow') return mon;
            var sun = new Date(mon); sun.setDate(mon.getDate() + 6); return sun;
        }
        return null;
    }

    // Inlocuieste prescurtarile din comanda cu forma "zi.luna" pe care restul parser-ului o intelege deja
    function preprocessShortcuts(val, curY, curM) {
        var today = new Date(); today.setHours(0, 0, 0, 0);
        function resolveSide(tok, refDate) {
            if (/^\d{1,2}$/.test(tok)) return new Date(curY, curM, parseInt(tok)); // zi simpla = ziua respectiva din luna vizualizata
            if (/^\+/.test(tok)) { var mm = tok.match(/^\+(\d+)([zsl])?$/i); return relDate(refDate, parseInt(mm[1]), mm[2] || 'z'); }
            return resolveToken(tok, refDate);
        }
        // Interval unde CEL PUTIN un capat e un shortcut sau "+N[u]" (ex: 10-eow, 19-eom, som-eom, bom-eom, +2l-eom)
        // Daca ambele capete sunt cifre simple, lasam neatins - se ocupa deja regula "7-14" (acelasi comportament ca inainte)
        var mShortInt = val.match(/^(\d{1,2}|[sb]om|eom|[sb]ow|eow|[sb]oy|eoy|\+\d+[zsl]?)-(\d{1,2}|[sb]om|eom|[sb]ow|eow|[sb]oy|eoy)\b\s*(.*)$/i);
        if (mShortInt) {
            var leftTok = mShortInt[1], rightTok = mShortInt[2], rest = mShortInt[3];
            var bothPlainDays = /^\d{1,2}$/.test(leftTok) && /^\d{1,2}$/.test(rightTok);
            if (!bothPlainDays) {
                var leftDate = resolveSide(leftTok, today);
                var rightDate = resolveSide(rightTok, leftDate); // eom din dreapta se raporteaza la luna capatului stang
                return leftDate.getDate() + '.' + (leftDate.getMonth() + 1) + '-' + rightDate.getDate() + '.' + (rightDate.getMonth() + 1) + ' ' + rest;
            }
        }
        // Shortcut simplu, la inceputul comenzii
        var mShort = val.match(/^([sb]om|eom|[sb]ow|eow|[sb]oy|eoy)\b(.*)$/i);
        if (mShort) {
            var dt = resolveToken(mShort[1], today);
            return dt.getDate() + '.' + (dt.getMonth() + 1) + mShort[2];
        }
        return val;
    }

    // REM n AT h[:m] - sufix optional la orice comanda de adaugare. n zile inainte, la ora h:m (sau aleator din sloturi daca lipseste ora)
    var REM_SLOTS = [[9,30],[10,0],[10,30],[11,0],[11,30],[12,0],[12,30],[13,0]];
    function extractRem(text) {
        var m = text.match(/\s*REM(\d*)(?:AT(\d{1,2})(?::(\d{2}))?)?\s*$/i);
        if (!m) return { text: text, rem: null };
        var n = m[1] ? parseInt(m[1]) : 0;
        var h, mi;
        if (m[2]) { h = parseInt(m[2]); mi = m[3] ? parseInt(m[3]) : 0; }
        else { var slot = REM_SLOTS[Math.floor(Math.random() * REM_SLOTS.length)]; h = slot[0]; mi = slot[1]; }
        return { text: text.slice(0, m.index).trim(), rem: { n:n, h:h, mi:mi } };
    }

    // Creeaza reminder-ul ca eveniment SEPARAT, cu ora (Google nu poate seta reminder-e native "cu ora" pe evenimente all-day)
    async function createReminder(startDate, remInfo, evText) {
        var tk = localStorage.getItem('gcal_token');
        if (!tk) { logDbg('REM: offline — reminder ignorat (nu se pot da notificări reale fără token).'); return; }
        var rd = new Date(startDate); rd.setDate(rd.getDate() - remInfo.n);
        var startDt = new Date(rd.getFullYear(), rd.getMonth(), rd.getDate(), remInfo.h, remInfo.mi);
        var endDt = new Date(startDt.getTime() + 30 * 60000);
        var body = { summary: '⏰ ' + evText, start:{dateTime:startDt.toISOString()}, end:{dateTime:endDt.toISOString()} };
        var r = await gcalFetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", { method:'POST', headers:{ Authorization:"Bearer "+tk, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
        logDbg('REM: creat reminder pt "'+evText+'" pe '+startDt.toString()+' — status='+r.status);
    }

    // Recurenta LOCALA (offline, fara token Google): verifica daca ziua curenta e o aparitie a evenimentului ev
    function isRecurrenceMatch(ev, curDt) {
        var base = new Date(ev.y, ev.m, ev.d);
        if (curDt < base) return false;
        var interval = ev.rec.interval || 1;
        if (ev.rec.freq === 'MONTHLY') {
            if (curDt.getDate() !== ev.d) return false;
            var diffM = (curDt.getFullYear() - ev.y) * 12 + (curDt.getMonth() - ev.m);
            return diffM >= 0 && diffM % interval === 0;
        }
        if (ev.rec.freq === 'YEARLY') {
            if (curDt.getDate() !== ev.d || curDt.getMonth() !== ev.m) return false;
            var diffY = curDt.getFullYear() - ev.y;
            return diffY >= 0 && diffY % interval === 0;
        }
        if (ev.rec.freq === 'WEEKLY') {
            var diffD = Math.round((curDt - base) / 86400000);
            if (diffD < 0 || diffD % 7 !== 0) return false;
            return (diffD / 7) % interval === 0;
        }
        return false;
    }

    function renderCalendar() {
        var body = document.getElementById('gridBody');
        var Y = viewDate.getFullYear(), M = viewDate.getMonth(), now = new Date(); now.setHours(0,0,0,0);
        var dayNames = ["DU", "LU", "MA", "MI", "JO", "VI", "SA"], monthNames = ["Ianuarie", "Februarie", "Martie", "Aprilie", "Mai", "Iunie", "Iulie", "August", "Septembrie", "Octombrie", "Noiembrie", "Decembrie"];
        document.getElementById('mLabel').innerHTML = monthNames[M] + " " + Y;
        var lastDay = new Date(Y, M + 1, 0).getDate();

        // RESTANTE: sarcini nebifate (done:false) datate strict inainte de ziua 1 a lunii afisate
        // v44 - Rest1: prag temporar (1 august 2026) cat esti la inceputul testarii, ca sa nu vezi restante
        // dinainte sa fi inceput sa bifezi cu adevarat. Sterge linia RESTANTE_CUTOFF cand nu mai ai nevoie de ea.
        var RESTANTE_CUTOFF = new Date(2026, 7, 1); // 1 august 2026
        var firstOfMonth = new Date(Y, M, 1);
        var overdue = localDB.concat(googleEvents).filter(function(ev) {
            if (ev.done || ev.rec) return false;
            var evDt = new Date(ev.y, ev.m, ev.d);
            return evDt < firstOfMonth && evDt >= RESTANTE_CUTOFF;
        }).sort(function(a, b) { return (new Date(a.y, a.m, a.d)) - (new Date(b.y, b.m, b.d)); });
        var ovZone = document.getElementById('overdueZone'), ovContent = document.getElementById('overdueContent');
        if (overdue.length) {
            var ovHtml = "";
            overdue.forEach(function(ev) {
                var edt = new Date(ev.y, ev.m, ev.d);
                ovHtml += '<div class="ev-item pending">';
                ovHtml += '<input type="checkbox" class="chk" onclick="tglStatus(\''+ev.id+'\', '+!!ev.isG+')">';
                ovHtml += '<span class="ev-txt" onclick="'+(ev.isG?('window.open(\''+ev.link+'\',\'_blank\')'):'')+'">'+(ev.isG?"☁️ ":"• ")+edt.getDate()+'.'+(edt.getMonth()+1)+' - '+ev.n+'</span>';
                ovHtml += '<div class="btn-i '+(ev.desc?'has-info':'')+'" onclick="openDesc(\''+ev.id+'\','+!!ev.isG+')">i</div>';
                ovHtml += '<div class="btn-x" onclick="delEv(\''+ev.id+'\','+!!ev.isG+')">×</div></div>';
            });
            ovContent.innerHTML = ovHtml;
            ovZone.style.display = 'block';
        } else {
            ovZone.style.display = 'none';
        }

        var html = "";
        for (var d = 1; d <= lastDay; d++) {
            var curDt = new Date(Y, M, d), isToday = (curDt.toDateString() === now.toDateString()), isWE = (curDt.getDay() % 6 === 0), key = Y+"-"+M+"-"+d;
            var dayEvs = localDB.concat(googleEvents).filter(function(ev){ 
                if (ev.rec) return isRecurrenceMatch(ev, curDt);
                var start = new Date(ev.y, ev.m, ev.d), end = new Date(ev.y, ev.m, ev.d + (ev.dur || 1) - 1);
                return curDt >= start && curDt <= end;
            });
            var hasUnfinished = dayEvs.some(function(x){return !x.done});
            if (ecoMode && curDt < now && !isToday) {
                logDbg('ECO ziua '+d+': dayEvs='+dayEvs.length+' nebifate='+hasUnfinished+' notă='+(!!journalData[key])+' → '+((!journalData[key] && !hasUnfinished) ? 'ASCUNSĂ' : 'afișată'));
            }
            if (ecoMode && curDt < now && !isToday && !journalData[key] && !hasUnfinished) continue;

            html += '<div class="r '+(isToday?'today':'')+' '+(isWE?'weekend':'')+'" '+(isToday?'id="scroll-today"':'')+'>';
            html += '<div class="c c-fix-nr c-sticky">'+d+'</div><div class="c c-fix-zi c-sticky c-date">'+dayNames[curDt.getDay()]+'</div>';
            ['m','c','a'].forEach(function(type) {
                html += '<div class="c" onclick="openAddModal('+d+',\''+type+'\')">';
                dayEvs.filter(function(x){return x.t === type}).forEach(function(ev){
                    // v44: start/final se determina prin comparatie de DATE reale, nu prin cifra bruta a zilei
                    // (o cifra de zi, ex. 4, se putea repeta in fiecare luna a intervalului - bug la intervale intre luni)
                    var evStartDt = new Date(ev.y, ev.m, ev.d), evEndDt = new Date(ev.y, ev.m, ev.d + (ev.dur || 1) - 1);
                    var isStart = curDt.getTime() === evStartDt.getTime(), isEnd = curDt.getTime() === evEndDt.getTime();
                    if (ev.dur > 1 && !isStart && !isEnd) return; // zi intermediara a intervalului - nu afisam, ca sa nu aglomeram
                    var disp = ev.n; if(ev.dur > 1) disp = isStart ? "(1:"+ev.dur+") "+ev.n : "<b>FINAL</b> "+ev.n;
                    var itemS = ev.done ? "done" : "pending";
                    // v43: un click = editeaza evenimentul EXISTENT; dublu-click = deschide adaugare NOU pe aceeasi zi/coloana
                    html += '<div class="ev-item '+itemS+'" onclick="event.stopPropagation(); openEditModal(\''+ev.id+'\','+!!ev.isG+')" ondblclick="event.stopPropagation(); openAddModal('+d+',\''+type+'\')">';
                    html += '<input type="checkbox" class="chk" '+(ev.done?'checked':'')+' onclick="event.stopPropagation(); tglStatus(\''+ev.id+'\', '+!!ev.isG+')">';
                    html += '<span class="ev-txt">'+(ev.isG?"☁️ ":"• ")+disp+'</span>';
                    if(ev.isG) html += '<div class="btn-link" onclick="event.stopPropagation(); window.open(\''+ev.link+'\',\'_blank\')">↗</div>';
                    html += '<div class="btn-i '+(ev.desc?'has-info':'')+'" onclick="event.stopPropagation(); openDesc(\''+ev.id+'\','+!!ev.isG+')">i</div>';
                    html += '<div class="btn-x" onclick="event.stopPropagation(); delEv(\''+ev.id+'\','+!!ev.isG+')">×</div></div>';
                });
                if(type === 'c' && journalData[key]) {
                    html += '<div class="j-item">';
                    html += '<span class="j-text" onclick="event.stopPropagation();">📝 '+journalData[key].n+'</span>';
                    html += '<div class="btn-i has-info" onclick="event.stopPropagation(); openDesc(\''+key+'\', false, true)">i</div>';
                    html += '<div class="btn-x" onclick="event.stopPropagation(); delNote(\''+key+'\')">×</div>';
                    html += '</div>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        body.innerHTML = html;
        if(M === now.getMonth()) setTimeout(function(){ document.getElementById('scroll-today')?.scrollIntoView({block:"center"}); }, 500);
    }

    // Bar1: Consola inteligenta fara spatii
    function runCommand() {
        var inp = document.getElementById('cmdInput'), val = inp.value.trim(); if(!val) return;
        var curM = viewDate.getMonth(), curY = viewDate.getFullYear();
        var hasTk = !!localStorage.getItem('gcal_token');
        logDbg('Comandă primită: "'+val+'" (token Google: '+hasTk+')');

        val = preprocessShortcuts(val, curY, curM);
        var remResult = extractRem(val);
        val = remResult.text;
        var remInfo = remResult.rem;
        if (remInfo) logDbg('→ REM detectat: cu '+remInfo.n+' zile înainte, la ora '+remInfo.h+':'+(remInfo.mi<10?'0':'')+remInfo.mi+'. Comandă rămasă: "'+val+'"');

        // 0. Date relative "peste N zile/saptamani/luni": +N (zile implicit), +Ns (saptamani), +Nl (luni)
        //    Interval: +N[u]-+M[u] Text  (ex: +3s-+5s Vacanta = peste 3 pana peste 5 saptamani)
        var today0 = new Date(); today0.setHours(0,0,0,0);
        var mRelInt = val.match(/^\+(\d+)([zsl])?\s*-\s*\+(\d+)([zsl])?\s*(.*)$/);
        if (mRelInt) {
            var n1 = parseInt(mRelInt[1]), u1 = mRelInt[2] || 'z', n2 = parseInt(mRelInt[3]), u2 = mRelInt[4] || 'z', txR = mRelInt[5];
            var dS = relDate(today0, n1, u1), dE = relDate(today0, n2, u2);
            if (dE < dS) { var tmp = dS; dS = dE; dE = tmp; }
            var durR = Math.round((dE - dS) / 86400000) + 1;
            if (hasTk) { addEventToGoogle(dS.getFullYear(), dS.getMonth(), dS.getDate(), durR, txR); logDbg('→ interval relativ → trimis spre Google.'); }
            else { localDB.push({ id:'L'+Date.now(), d:dS.getDate(), m:dS.getMonth(), y:dS.getFullYear(), t:getCategory(txR), n:txR, dur:durR, done:false }); saveAll(); logDbg('→ interval relativ → LOCAL (offline).'); }
            if (remInfo) createReminder(dS, remInfo, txR);
            viewDate = new Date(dS.getFullYear(), dS.getMonth(), 1); googleEvents = []; renderCalendar(); if(!hasTk) syncGoogle();
            inp.value = ""; return;
        }
        var mRel = val.match(/^\+(\d+)([zsl])?\s*(.*)$/);
        if (mRel) {
            var nR = parseInt(mRel[1]), uR = mRel[2] || 'z', txR2 = mRel[3];
            var dR = relDate(today0, nR, uR);
            if (hasTk) { addEventToGoogle(dR.getFullYear(), dR.getMonth(), dR.getDate(), 1, txR2); logDbg('→ dată relativă → trimisă spre Google.'); }
            else { localDB.push({ id:'L'+Date.now(), d:dR.getDate(), m:dR.getMonth(), y:dR.getFullYear(), t:getCategory(txR2), n:txR2, dur:1, done:false }); saveAll(); logDbg('→ dată relativă → LOCAL (offline).'); }
            if (remInfo) createReminder(dR, remInfo, txR2);
            viewDate = new Date(dR.getFullYear(), dR.getMonth(), 1); googleEvents = []; renderCalendar(); if(!hasTk) syncGoogle();
            inp.value = ""; return;
        }

        // 0c. Interval INTRE LUNI diferite (4.7-30.9 Text = din 4 iulie pana in 30 septembrie)
        var mCross = val.match(/^(\d{1,2})\.(\d{1,2})-(\d{1,2})\.(\d{1,2})\s*(.*)$/);
        if (mCross) {
            var d1 = parseInt(mCross[1]), m1 = parseInt(mCross[2]) - 1, d2 = parseInt(mCross[3]), m2 = parseInt(mCross[4]) - 1, txCross = mCross[5] || '';
            var yS = curY, yE = (m2 < m1) ? curY + 1 : curY;
            var dtS = new Date(yS, m1, d1), dtE = new Date(yE, m2, d2);
            if (dtE < dtS) { var tmpDt = dtS; dtS = dtE; dtE = tmpDt; }
            var durCross = Math.round((dtE - dtS) / 86400000) + 1;
            if (hasTk) { addEventToGoogle(dtS.getFullYear(), dtS.getMonth(), dtS.getDate(), durCross, txCross); logDbg('→ interval între luni → trimis spre Google, '+durCross+' zile.'); }
            else { localDB.push({ id:'L'+Date.now(), d:dtS.getDate(), m:dtS.getMonth(), y:dtS.getFullYear(), t:getCategory(txCross), n:txCross, dur:durCross, done:false }); saveAll(); renderCalendar(); logDbg('→ interval între luni → LOCAL (offline), '+durCross+' zile.'); }
            if (remInfo) createReminder(dtS, remInfo, txCross);
            inp.value = ""; return;
        }

        // 0b. Interval pe zile in aceeasi luna (7-14 Text) - calculeaza automat durata, elimina eroarea de calcul manual (off-by-one)
        var mRange = val.match(/^(\d{1,2})-(\d{1,2})\s*(.*)$/);
        if (mRange) {
            var dStart = parseInt(mRange[1]), dEnd = parseInt(mRange[2]), txRange = mRange[3] || '';
            if (dEnd < dStart) { var tmpD = dStart; dStart = dEnd; dEnd = tmpD; }
            var durRange = dEnd - dStart + 1;
            if (hasTk) { addEventToGoogle(curY, curM, dStart, durRange, txRange); logDbg('→ interval în aceeași lună → trimis spre Google, '+durRange+' zile.'); }
            else { localDB.push({ id:'L'+Date.now(), d:dStart, m:curM, y:curY, t:getCategory(txRange), n:txRange, dur:durRange, done:false }); saveAll(); renderCalendar(); logDbg('→ interval în aceeași lună → LOCAL (offline), '+durRange+' zile.'); }
            if (remInfo) createReminder(new Date(curY, curM, dStart), remInfo, txRange);
            inp.value = ""; return;
        }

        // 1. Stergere (12D21 sau 12.8D21 pentru alta luna)
        var mDel = val.match(/^(\d{1,2})(?:\.(\d{1,2}))?D([1-3])(\d+)/i);
        if(mDel) {
            var d = parseInt(mDel[1]), delM = mDel[2] ? parseInt(mDel[2])-1 : curM, colI = parseInt(mDel[3]), rowI = parseInt(mDel[4]);
            var type = colI === 1 ? 'm' : colI === 2 ? 'c' : 'a';
            var evs = localDB.concat(googleEvents).filter(function(e){ return e.d === d && e.t === type && e.m === delM && e.y === curY; });
            if(evs[rowI-1]) { delEv(evs[rowI-1].id, !!evs[rowI-1].isG); logDbg('→ Recunoscut ca: ștergere. Găsit și șters: "'+evs[rowI-1].n+'"'); }
            else logDbg('→ Recunoscut ca: ștergere, dar NU am găsit niciun eveniment pe ziua '+d+'.'+(delM+1)+', coloana '+colI+', rândul '+rowI+'.');
            inp.value = ""; return;
        }

        // 2. Nota (15NText sau 14.8NText pentru alta luna) - trimisa la Google ca eveniment "📝 text" daca esti conectat
        var mNote = val.match(/^(\d{1,2})(?:\.(\d{1,2}))?N\s*(.*)/i);
        if(mNote) {
            var noteD = parseInt(mNote[1]), noteM = mNote[2] ? parseInt(mNote[2]) - 1 : curM, noteText = mNote[3];
            var noteKey = curY+'-'+noteM+'-'+noteD;
            var existGid = journalData[noteKey] && journalData[noteKey].gid;
            if (hasTk) { upsertNoteGoogle(curY, noteM, noteD, noteText, existGid); logDbg('→ Recunoscut ca: notă → trimisă spre Google (ziua '+noteD+'.'+(noteM+1)+').'); }
            else { journalData[noteKey] = { n: noteText, gid: existGid || null }; saveAll(); renderCalendar(); logDbg('→ Recunoscut ca: notă LOCALĂ (offline) pe ziua '+noteD+'.'+(noteM+1)+': "'+noteText+'"'); }
            inp.value = ""; return;
        }

        // 3. Adaugare Rapida (15RLGaz, 15Gaz, sau 14.8Gaz pentru alta luna) - R[n][S/L/A] = recurenta REALA
        var mEv = val.match(/^(\d{1,2})(?:\.(\d{1,2}))?(R(\d*)([SLA]))?\s*(.*)/i);
        if(mEv) {
            var day = parseInt(mEv[1]), evM = mEv[2] ? parseInt(mEv[2]) - 1 : curM, fullPref = mEv[3]||'', interval = parseInt(mEv[4]||'1'), letter = (mEv[5]||'').toUpperCase(), tx = mEv[6]||'';
            var cat = getCategory(fullPref||tx), name = (fullPref?fullPref+' ':'')+tx;

            if (letter) {
                var freqMap = { L: 'MONTHLY', S: 'WEEKLY', A: 'YEARLY' };
                var freq = freqMap[letter];
                if (hasTk) {
                    addRecurringToGoogle(day, evM, curY, name, freq, interval);
                    logDbg('→ Recunoscut ca: recurență REALĂ trimisă spre Google ('+freq+', interval '+interval+').');
                } else {
                    localDB.push({ id:'L'+Date.now(), d:day, m:evM, y:curY, t:cat, n:name, dur:1, done:false, rec:{freq:freq, interval:interval} });
                    saveAll(); renderCalendar();
                    logDbg('→ Recunoscut ca: recurență LOCALĂ (offline, fără token Google), '+freq+'.');
                }
                if (remInfo) createReminder(new Date(curY, evM, day), remInfo, name);
            } else {
                if (hasTk) { addEventToGoogle(curY, evM, day, 1, name); logDbg('→ Recunoscut ca: adăugare → trimisă spre Google pe ziua '+day+'.'+(evM+1)+': "'+name+'"'); }
                else { localDB.push({ id:'L'+Date.now(), d:day, m:evM, y:curY, t:cat, n:name, dur:1, done:false }); saveAll(); renderCalendar(); logDbg('→ Recunoscut ca: adăugare LOCALĂ (offline) pe ziua '+day+'.'+(evM+1)+': "'+name+'"'); }
                if (remInfo) createReminder(new Date(curY, evM, day), remInfo, name);
            }
            inp.value = "";
            return;
        }

        logDbg('→ NERECUNOSCUT — nicio regulă de sintaxă nu s-a potrivit cu "'+val+'". Nimic nu a fost creat.');
    }

    // Trimite un eveniment PUNCTUAL (nu recurent) direct in Google Calendar - baza sincronizarii bidirectionale
    async function addEventToGoogle(y, m, d, dur, name) {
        var tk = localStorage.getItem('gcal_token');
        var body = { summary: name, start: { date: isoDate(y, m, d) }, end: { date: isoDate(y, m, d + dur) } };
        var resp = await gcalFetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", { method:'POST', headers:{ Authorization:"Bearer "+tk, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
        logDbg('addEventToGoogle: POST status='+resp.status+' pt "'+name+'"');
        syncGoogle();
    }

    // Creeaza SAU actualizeaza o nota de jurnal ca eveniment Google cu prefix "📝 " (ca sa fie recunoscuta la citire ca nota, nu task)
    async function upsertNoteGoogle(y, m, d, text, existingGid) {
        var tk = localStorage.getItem('gcal_token');
        if (existingGid) {
            var r = await gcalFetch("https://www.googleapis.com/calendar/v3/calendars/primary/events/"+existingGid, { method:'PATCH', headers:{ Authorization:"Bearer "+tk, 'Content-Type':'application/json' }, body: JSON.stringify({ summary: '📝 '+text }) });
            logDbg('upsertNoteGoogle: PATCH status='+r.status);
        } else {
            var body = { summary: '📝 '+text, start:{date:isoDate(y,m,d)}, end:{date:isoDate(y,m,d+1)} };
            var r2 = await gcalFetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", { method:'POST', headers:{ Authorization:"Bearer "+tk, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
            logDbg('upsertNoteGoogle: POST status='+r2.status);
        }
        syncGoogle();
    }
    async function delNoteGoogle(gid) {
        var tk = localStorage.getItem('gcal_token');
        var r = await gcalFetch("https://www.googleapis.com/calendar/v3/calendars/primary/events/"+gid, { method:'DELETE', headers:{ Authorization:"Bearer "+tk } });
        logDbg('delNoteGoogle: DELETE status='+r.status);
        syncGoogle();
    }
    async function delNote(key) {
        var note = journalData[key];
        if (!note) return;
        if (!confirm('Ștergi nota: '+note.n+'?')) return;
        if (note.gid && localStorage.getItem('gcal_token')) { await delNoteGoogle(note.gid); }
        delete journalData[key]; saveAll(); renderCalendar();
    }

    async function delEv(id, isG) { var ev=localDB.concat(googleEvents).find(function(x){return x.id===id}); if(!ev||!confirm("Ștergi: "+ev.n+"?"))return; if(isG){ var tk=localStorage.getItem('gcal_token'); await gcalFetch("https://www.googleapis.com/calendar/v3/calendars/primary/events/"+id,{method:'DELETE',headers:{Authorization:"Bearer "+tk}}); syncGoogle(); } else { localDB=localDB.filter(function(x){return x.id!==id}); saveAll(); renderCalendar(); } }
    function openDesc(id, isG, isJ) { activeDescRef={id:id,isG:isG,isJ:!!isJ}; var t=isJ?(journalData[id]?journalData[id].n:''):localDB.concat(googleEvents).find(function(x){return x.id===id}).desc; document.getElementById('descText').value=t||""; document.getElementById('descModal').style.display='flex'; }
    document.getElementById('btnSaveDesc').onclick = async function() {
        var t = document.getElementById('descText').value;
        if (activeDescRef.isJ) {
            var key = activeDescRef.id, parts = key.split('-'), ny = parseInt(parts[0]), nm = parseInt(parts[1]), nd = parseInt(parts[2]);
            var existGid2 = journalData[key] && journalData[key].gid;
            if (localStorage.getItem('gcal_token')) { await upsertNoteGoogle(ny, nm, nd, t, existGid2); }
            else { journalData[key] = { n:t, gid: existGid2 || null }; }
        } else if (activeDescRef.isG) {
            var tk=localStorage.getItem('gcal_token'); await gcalFetch("https://www.googleapis.com/calendar/v3/calendars/primary/events/"+activeDescRef.id,{method:'PATCH',headers:{Authorization:"Bearer "+tk,'Content-Type':'application/json'},body:JSON.stringify({description:t})}); syncGoogle();
        } else {
            var e=localDB.find(function(x){return x.id===activeDescRef.id}); if(e) e.desc=t;
        }
        saveAll(); closeModal(); renderCalendar();
    };
    function toggleZoom() { zoomLevel=(zoomLevel+1)%3; applyZoom(); localStorage.setItem('trident_zoom', zoomLevel); renderCalendar(); }
    function applyZoom() { document.body.classList.remove('compact', 'mini'); if(zoomLevel===1) document.body.classList.add('compact'); if(zoomLevel===2) document.body.classList.add('mini'); var lbl=document.getElementById('zoomLbl'); if(lbl) lbl.textContent = (zoomLevel+1); }
    function applyEcoStyle() { var b=document.getElementById('btnEco'); if(!b) return; b.classList.remove('eco-active','eco-inactive'); b.classList.add(ecoMode ? 'eco-active' : 'eco-inactive'); }
    function openAddModal(d, t) {
        editRef = { isEdit:false, d:d, t:t };
        document.getElementById('modalTitle').textContent = 'Nou';
        document.getElementById('evName').value = '';
        document.getElementById('evDur').value = 1;
        document.getElementById('editModal').style.display = 'flex';
    }
    function openEditModal(id, isG) {
        var ev = localDB.concat(googleEvents).find(function(x){ return x.id === id; });
        logDbg('openEditModal: id='+id+' isG='+isG+' găsit='+(!!ev)+(ev?(' text-actual="'+ev.n+'"'):''));
        if (!ev) { logDbg('openEditModal: OPRIT — evenimentul nu a fost găsit în localDB/googleEvents.'); return; }
        editRef = { isEdit:true, id:id, isG:isG, d:ev.d, m:ev.m, y:ev.y, t:ev.t };
        document.getElementById('modalTitle').textContent = 'Editează';
        document.getElementById('evName').value = ev.n;
        document.getElementById('evDur').value = ev.dur || 1;
        document.getElementById('editModal').style.display = 'flex';
    }
    function closeModal() { document.querySelectorAll('.modal').forEach(function(m){m.style.display='none'}); }
    function saveAll() { localStorage.setItem('trident_db_v49', JSON.stringify(localDB)); localStorage.setItem('trident_j_v49', JSON.stringify(journalData)); }
    function navMonth(dir) { viewDate.setMonth(viewDate.getMonth()+dir); googleEvents=[]; renderCalendar(); syncGoogle(); }
    function toggleEco() { ecoMode=!ecoMode; localStorage.setItem('trident_eco', ecoMode); applyEcoStyle(); renderCalendar(); }
    function calLogin() { window.location.href="https://accounts.google.com/o/oauth2/v2/auth?client_id="+GCAL_CLIENT_ID+"&redirect_uri="+encodeURIComponent(GCAL_REDIRECT)+"&response_type=token&scope="+encodeURIComponent("https://www.googleapis.com/auth/calendar.events")+"&prompt=select_account"; }
    function handleGoogleCallback() { var p=new URLSearchParams(window.location.hash.substring(1)); var t=p.get('access_token'); if(t){localStorage.setItem('gcal_token',t); window.location.hash=""; syncGoogle();} }
    async function tglStatus(id, isG) { var ev=localDB.concat(googleEvents).find(function(x){return x.id===id}); if(!ev)return; if(isG){ ev.done=!ev.done; var tk=localStorage.getItem('gcal_token'); await gcalFetch("https://www.googleapis.com/calendar/v3/calendars/primary/events/"+id,{method:'PATCH',headers:{Authorization:"Bearer "+tk,'Content-Type':'application/json'},body:JSON.stringify({summary:ev.done?ev.n+" [OK]":ev.n.replace("[OK]","").trim()})}); syncGoogle(); } else { ev.done=!ev.done; saveAll(); renderCalendar(); } }
    function isoDate(y, m, d) { var dt = new Date(y, m, d); var pad = function(x){ return x < 10 ? '0'+x : ''+x; }; return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate()); }
    document.getElementById('btnSave').onclick = async function() {
        var n = document.getElementById('evName').value.trim();
        var dur = parseInt(document.getElementById('evDur').value) || 1;
        logDbg('btnSave apăsat: isEdit='+(editRef&&editRef.isEdit)+' id='+(editRef&&editRef.id)+' isG='+(editRef&&editRef.isG)+' text nou="'+n+'" dur='+dur);
        if (!n) { logDbg('btnSave: OPRIT — numele e gol.'); closeModal(); return; }
        if (editRef.isEdit) {
            if (editRef.isG) {
                var ev = googleEvents.find(function(x){ return x.id === editRef.id; });
                var doneSuffix = (ev && ev.done) ? ' [OK]' : '';
                var tk = localStorage.getItem('gcal_token');
                var patchBody = { summary: n + doneSuffix };
                // trimitem start/end DOAR daca durata s-a schimbat efectiv - altfel riscam sa stricam formatul original
                // (evenimente cu ora, sau instante ale unei serii recurente, nu accepta start.date/end.date all-day pe PATCH)
                if (ev && dur !== ev.dur) {
                    // end.date la Google e EXCLUSIV (ziua urmatoare ultimei zile) - d + dur, nu d + dur - 1
                    patchBody.start = { date: isoDate(editRef.y, editRef.m, editRef.d) };
                    patchBody.end = { date: isoDate(editRef.y, editRef.m, editRef.d + dur) };
                }
                var respP = await gcalFetch("https://www.googleapis.com/calendar/v3/calendars/primary/events/"+editRef.id, {
                    method:'PATCH', headers:{ Authorization:"Bearer "+tk, 'Content-Type':'application/json' },
                    body: JSON.stringify(patchBody)
                });
                var respTxt = respP.status >= 400 ? await respP.text() : '';
                logDbg('btnSave (Google): PATCH status='+respP.status+(patchBody.start?' (cu schimbare durată)':' (doar text)')+(respTxt?(' — '+respTxt):''));
                syncGoogle();
            } else {
                var e = localDB.find(function(x){ return x.id === editRef.id; });
                logDbg('btnSave (local): găsit în localDB='+(!!e));
                if (e) { e.n = n; e.dur = dur; }
                saveAll(); renderCalendar();
                logDbg('btnSave (local): salvat. localDB are acum '+localDB.length+' intrări.');
            }
        } else {
            localDB.push({ id:'L'+Date.now(), d:editRef.d, m:viewDate.getMonth(), y:viewDate.getFullYear(), t:editRef.t, n:n, dur:dur, done:false });
            saveAll(); renderCalendar();
            logDbg('btnSave (nou): adăugat local pe ziua '+editRef.d);
        }
        closeModal();
    };
</script>
</body>
