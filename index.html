    function getCategory(text, rrule) {
        var s = (text || "").toUpperCase().trim();
        if (s.indexOf("RA") == 0 || s.indexOf("R1A") == 0 || s.indexOf("ZI ") == 0 || s.indexOf("ZIUA ") == 0 || s.indexOf("ZILE ") == 0) return 'a';
        if (s.indexOf("CUNUNIE") > -1 || s.indexOf("NUNTA") > -1 || s.indexOf("SF.") > -1 || s.indexOf("SFANT") > -1 || s.indexOf("SFÂNT") > -1 || s.indexOf("CATOLIC") > -1 || s.indexOf("ORTODOX") > -1 || s.indexOf("ADORMIREA") > -1) return 'a';
        if (s.indexOf("RL") == 0 || s.indexOf("R1L") == 0 || s.indexOf("R2L") == 0 || s.indexOf("R3L") == 0) return 'm';
        if (s.indexOf("RS") == 0 || s.indexOf("R1S") == 0 || s.indexOf("R2S") == 0 || s.indexOf("R4S") == 0) return 'c';
        if (rrule) {
            if (rrule.indexOf("MONTHLY") > -1) return 'm';
            if (rrule.indexOf("YEARLY") > -1) return 'a';
        }
        return 'c';
    }

        var Y = viewDate.getFullYear(), M = viewDate.getMonth(), now = new Date(); now.setHours(0,0,0,0);

            }
            if (ecoMode && curDt < now && !isToday) {
                var pend = false; for(var k=0; k<dayEvs.length; k++) if(!dayEvs[k].done) pend = true;

                        html += '<div class="ev-item '+st+'" onclick="event.stopPropagation(); openAdd('+d+',\''+tArr[t]+'\')">';

                        html += '<span class="ev-txt">'+(e.isG?"☁️ ":"• ")+tx+'</span>';

                }
