<!-- START OF FILE: index.html (Trident v41) -->
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
    <link rel="manifest" href="manifest.json"/>
    <title>Trident v41</title>
    <style>
        :root {
            --bg: #FFFFFF; --header-bg: #1e293b; --border: #cbd5e1;
            --text: #1e293b; --accent: #2563EB;
            --weekend-bg: #e0f2fe; --today-yellow: #ffff00;
            --pink-pending: #fff1f2; --green-done: #dcfce7;
            --row-h: 50px; --f-size: 11px;
        }
        body.compact { --row-h: 38px; --f-size: 10px; }
        body.mini { --row-h: 28px; --f-size: 9px; }

        body { font-family: sans-serif; margin: 0; padding: 0; background: white; color: var(--text); overflow-x: hidden; width: 100vw; }
        .hdr { background: #1e293b; color: white; padding: 5px 10px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 2000; height: 45px; }
        .v-badge { background: #2563EB; color: white; padding: 2px 4px; border-radius: 3px; font-size: 9px; font-weight: bold; }
        .nav-btn { background: #334155; color: white; border: 1px solid #475569; border-radius: 4px; padding: 5px 8px; font-size: 11px; cursor: pointer; font-weight: bold; }

        .grid { display: block; width: 100%; min-width: 850px; padding-bottom: 80px; }
        .h-r { display: flex; width: 100%; background: #f1f5f9; font-weight: bold; font-size: 10px; position: sticky; top: 45px; z-index: 1500; border-bottom: 2px solid #94a3b8; height: 38px; }
        .h-r .c { display: flex !important; justify-content: flex-end !important; align-items: center !important; padding-bottom: 3px !important; flex-direction: column; }

        .r { display: flex; width: 100%; border-bottom: 1px solid var(--border); min-height: var(--row-h); }
        .c { border-right: 1px solid var(--border); padding: 1px 2px; flex: 1; overflow: hidden; display: flex; flex-direction: column; position: relative; min-width: 0; }
        
        .c-fix-nr { flex: 0 0 24px; justify-content: center; text-align: center; font-weight: bold; font-size: 11px; }
        .c-fix-zi { flex: 0 0 32px; justify-content: center; text-align: center; font-weight: bold; font-size: 10px; }
        .c-sticky { position: sticky; left: 0; z-index: 100; background: inherit; }
        .c-date { left: 24px; border-right: 2px solid #64748b; }

        .r.weekend { background-color: var(--weekend-bg) !important; }
        .r.today { background-color: var(--today-yellow) !important; outline: 2px solid orange; outline-offset: -2px; }
        .r.today .c-sticky { background-color: var(--today-yellow) !important; }

        .ev-item { display: flex; align-items: center; gap: 3px; padding: 2px; border-radius: 3px; margin-bottom: 1px; border: 1px solid rgba(0,0,0,0.05); font-size: var(--f-size); font-weight: 600; line-height: 1.1; cursor: pointer; }
        .ev-item.pending { background: var(--pink-pending); border-left: 3px solid #f43f5e; }
        .ev-item.done { background: var(--green-done); border-left: 3px solid #22c55e; opacity: 0.6; text-decoration: line-through; }
        
        .ev-txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .btn-x { color: #f43f5e; font-weight: bold; padding: 0 4px; font-size: 12px; cursor: pointer; flex-shrink: 0; }
        .btn-i { background: white; border: 1px solid #ccc; border-radius: 50%; width: 14px; height: 14px; font-size: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .btn-i.has-info { background: #fbbf24; border-color: #d97706; }

        .j-item { display: flex; align-items: center; gap: 3px; margin-top: auto; padding-top: 2px; border-top: 1px dotted #ccc; }
        .j-text { font-size: 9px; font-style: italic; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        
        .cmd-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #f1f5f9; padding: 6px; display: flex; border-top: 2px solid #2563EB; z-index: 2000; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; align-items: center; justify-content: center; padding: 15px; }
        .m-box { background: white; padding: 15px; border-radius: 8px; width: 95%; max-width: 400px; color: black; }
        textarea { width: 100%; height: 120px; font-family: inherit; margin-top: 10px; border: 1px solid #ccc; border-radius: 5px; padding: 8px; }
    </style>
</head>

<body onload="initApp()">

<header class="hdr">
    <div class="v-badge" onclick="location.reload()">v41</div>
    <div id="mLabel" style="font-weight: bold; font-size: 13px; text-transform: uppercase;">...</div>
    <div style="display:flex; gap:4px;">
        <button class="nav-btn" onclick="toggleZoom()">[Z]</button>
        <button id="btnEco" class="nav-btn" onclick="toggleEco()">ECO</button>
        <button class="nav-btn sync" style="background:#10b981" onclick="calLogin()">SYNC</button>
        <button class="nav-btn" onclick="navMonth(-1)">&lt;</button>
        <button class="nav-btn" onclick="navMonth(1)">&gt;</button>
    </div>
</header>

<div id="overdueZone" style="display:none; background:#fee2e2; border:2px solid #ef4444; margin:5px; padding:8px; border-radius:8px;">
    <div style="color:#b91c1c; font-weight:900; font-size:10px; text-transform:uppercase;">Restanțe</div>
    <div id="overdueContent"></div>
</div>

<div class="grid" id="mainGrid">
    <div class="h-r">
        <div class="c c-fix-nr c-sticky">Nr</div>
        <div class="c c-fix-zi c-sticky c-date">Zi</div>
        <div class="c">LUNARE</div>
        <div class="c">CURENTE</div>
        <div class="c">ANUALE</div>
    </div>
    <div id="gridBody"></div>
</div>

<div class="cmd-bar">
    <input type="text" id="cmdInput" style="flex:1; padding:10px; font-size: 16px; border:1px solid #ccc; border-radius:5px;" placeholder="Ex: 12D21 | 15RLGaz | 20NNota">
    <button onclick="runCommand()" style="margin-left:5px; padding:10px; background:#2563EB; color:white; border:none; font-weight:bold; border-radius:5px;">OK</button>
</div>

<!-- Modalele raman neschimbate (Edit, Desc) -->
<div id="descModal" class="modal"><div class="m-box"><h3 style="font-size:14px;margin:0;">Detalii</h3><textarea id="descText"></textarea><div style="display:flex;gap:10px;margin-top:15px;"><button class="nav-btn" style="flex:1;background:#ccc;color:black;" onclick="closeModal()">ÎNCHIDE</button><button class="nav-btn" style="flex:1;background:#2563EB;" id="btnSaveDesc">SALVEAZĂ</button></div></div></div>
<div id="editModal" class="modal"><div class="m-box"><h3 id="modalTitle">Nou</h3><input type="text" id="evName" placeholder="Nume" style="width:100%;padding:10px;border:1px solid #ccc;"><input type="number" id="evDur" value="1" style="width:100%;padding:10px;margin-top:10px;border:1px solid #ccc;"><div style="display:flex;gap:10px;margin-top:15px;"><button class="nav-btn" style="flex:1;background:#ccc;color:black;" onclick="closeModal()">ANULARE</button><button class="nav-btn" style="flex:1;background:var(--accent);" id="btnSave">SALVEAZĂ</button></div></div></div>

<script>
    var GCAL_CLIENT_ID = '705792153280-6u766blorfafm3taeonfcufbihggd3ee.apps.googleusercontent.com';
    var GCAL_REDIRECT = window.location.origin + window.location.pathname;
    var viewDate = new Date(), localDB = [], journalData = {}, googleEvents = [], ecoMode = false, zoomLevel = 0, editRef = null, activeDescRef = null;

    function initApp() {
        try {
            localDB = JSON.parse(localStorage.getItem('trident_db_v41') || localStorage.getItem('trident_db_v40') || localStorage.getItem('trident_db_v39') || '[]');
            journalData = JSON.parse(localStorage.getItem('trident_j_v41') || localStorage.getItem('trident_j_v40') || localStorage.getItem('trident_j_v39') || '{}');
            ecoMode = localStorage.getItem('trident_eco') === 'true';
            zoomLevel = parseInt(localStorage.getItem('trident_zoom') || '0');
            applyZoom();
            if(window.location.hash.indexOf('access_token') > -1) handleGoogleCallback();
            else { renderCalendar(); if(localStorage.getItem('gcal_token')) syncGoogle(); }
        } catch(e) { console.error(e); }
    }

    // C1: Detector prioritizat (Cununie/Nunta la Anuale)
    function getCategory(text, rrule) {
        var s = (text || "").toUpperCase().trim();
        if (/^R\d*L/.test(s)) return 'm';
        if (/^R\d*S/.test(s) || /^RS/.test(s)) return 'c';
        // RA1: Cununie si Nunta fortate la ANUALE
        if (/^RA/.test(s) || /^R\d*A/.test(s) || /SF\.|SFÂNT|SFANT|ZI |ZIUA |ZILE |NUNTA|CUNUNIE|BOTEZ|ORTODOX|CATOLIC|ADORMIREA/.test(s)) return 'a';
        if (rrule) {
            if (rrule.indexOf('MONTHLY') > -1) return 'm';
            if (rrule.indexOf('YEARLY') > -1) return 'a';
        }
        return 'c';
    }

    async function syncGoogle() {
        var token = localStorage.getItem('gcal_token'); if (!token) return;
        var start = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1).toISOString();
        var end = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0, 23, 59, 59).toISOString();
        try {
            // PAS 1: aparitiile (instances) lunii curente - pentru afisare pe zile
            var r = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin="+start+"&timeMax="+end+"&singleEvents=true&orderBy=startTime", { headers: { Authorization: "Bearer " + token } });
            var d = await r.json();
            if (d.items) {
                // PAS 2: evenimentele "master" (recurente) - singurul loc unde exista campul recurrence/RRULE real
                var rM = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin="+start+"&timeMax="+end+"&singleEvents=false", { headers: { Authorization: "Bearer " + token } });
                var dM = await rM.json();
                var rruleMap = {};
                (dM.items || []).forEach(function(me) { if (me.recurrence) rruleMap[me.id] = me.recurrence[0]; });

                googleEvents = d.items.map(function(ge) {
                    var sDt = new Date(ge.start.dateTime || ge.start.date), eDt = new Date(ge.end.dateTime || ge.end.date);
                    var dur = Math.round((eDt - sDt) / 86400000) || 1;
                    var title = ge.summary || "", isDone = title.indexOf("[OK]") > -1;
                    var link = ge.htmlLink || ('https://www.google.com/calendar/event?eid=' + ge.id);
                    // RRULE real: fie de pe evenimentul insusi (daca e chiar master-ul), fie preluat de la parintele lui (recurringEventId)
                    var realRrule = (ge.recurrence && ge.recurrence[0]) || rruleMap[ge.recurringEventId] || null;
                    return { id: ge.id, d: sDt.getDate(), m: sDt.getMonth(), y: sDt.getFullYear(), n: title.replace("[OK]", "").trim(), t: getCategory(title, realRrule), dur: dur, isG: true, done: isDone, link: link, desc: ge.description || "" };
                });
                renderCalendar();
            }
        } catch (e) { renderCalendar(); }
    }

    // Creeaza un eveniment REAL recurent direct in Google Calendar (RRULE), ca sa apara automat in toate lunile viitoare
    async function addRecurringToGoogle(day, m, y, name, freq, interval) {
        var tk = localStorage.getItem('gcal_token');
        var dateStr = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
        var body = { summary: name, start: { date: dateStr }, end: { date: dateStr }, recurrence: ['RRULE:FREQ=' + freq + ';INTERVAL=' + interval] };
        await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", { method: 'POST', headers: { Authorization: "Bearer " + tk, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        syncGoogle();
    }

    // Recurenta LOCALA (offline, fara token Google): verifica daca ziua curenta e o aparitie a evenimentului ev
    function isRecurrenceMatch(ev, curDt) {
        var base = new Date(ev.y, ev.m, ev.d);
        if (curDt < base) return false;
        var interval = ev.rec.interval || 1;
        if (ev.rec.freq === 'MONTHLY') {
            if (curDt.getDate() !== ev.d) return false;
            var diffM = (curDt.getFullYear() - ev.y) * 12 + (curDt.getMonth() - ev.m);
            return diffM >= 0 && diffM % interval === 0;
        }
        if (ev.rec.freq === 'YEARLY') {
            if (curDt.getDate() !== ev.d || curDt.getMonth() !== ev.m) return false;
            var diffY = curDt.getFullYear() - ev.y;
            return diffY >= 0 && diffY % interval === 0;
        }
        if (ev.rec.freq === 'WEEKLY') {
            var diffD = Math.round((curDt - base) / 86400000);
            if (diffD < 0 || diffD % 7 !== 0) return false;
            return (diffD / 7) % interval === 0;
        }
        return false;
    }

    function renderCalendar() {
        var body = document.getElementById('gridBody');
        var Y = viewDate.getFullYear(), M = viewDate.getMonth(), now = new Date(); now.setHours(0,0,0,0);
        var dayNames = ["DU", "LU", "MA", "MI", "JO", "VI", "SA"], monthNames = ["Ianuarie", "Februarie", "Martie", "Aprilie", "Mai", "Iunie", "Iulie", "August", "Septembrie", "Octombrie", "Noiembrie", "Decembrie"];
        document.getElementById('mLabel').innerHTML = monthNames[M] + " " + Y;
        var lastDay = new Date(Y, M + 1, 0).getDate();
        
        var html = "";
        for (var d = 1; d <= lastDay; d++) {
            var curDt = new Date(Y, M, d), isToday = (curDt.toDateString() === now.toDateString()), isWE = (curDt.getDay() % 6 === 0), key = Y+"-"+M+"-"+d;
            var dayEvs = localDB.concat(googleEvents).filter(function(ev){ 
                if (ev.rec) return isRecurrenceMatch(ev, curDt);
                var start = new Date(ev.y, ev.m, ev.d), end = new Date(ev.y, ev.m, ev.d + (ev.dur || 1) - 1);
                return (d === ev.d || d === (ev.d + ev.dur - 1)) && curDt >= start && curDt <= end;
            });
            if (ecoMode && curDt < now && !isToday && !dayEvs.some(function(x){return !x.done})) continue;

            html += '<div class="r '+(isToday?'today':'')+' '+(isWE?'weekend':'')+'" '+(isToday?'id="scroll-today"':'')+'>';
            html += '<div class="c c-fix-nr c-sticky">'+d+'</div><div class="c c-fix-zi c-sticky c-date">'+dayNames[curDt.getDay()]+'</div>';
            ['m','c','a'].forEach(function(type) {
                html += '<div class="c" onclick="openAddModal('+d+',\''+type+'\')">';
                dayEvs.filter(function(x){return x.t === type}).forEach(function(ev){
                    var disp = ev.n; if(ev.dur > 1) disp = (d === ev.d) ? "(1:"+ev.dur+") "+ev.n : "<b>FINAL</b> "+ev.n;
                    var itemS = ev.done ? "done" : "pending";
                    // C2: ondblclick pe element
                    html += '<div class="ev-item '+itemS+'" ondblclick="window.open(\''+ev.link+'\',\'_blank\')" onclick="event.stopPropagation(); openAddModal('+d+',\''+type+'\')">';
                    html += '<input type="checkbox" class="chk" '+(ev.done?'checked':'')+' onclick="event.stopPropagation(); tglStatus(\''+ev.id+'\', '+!!ev.isG+')">';
                    html += '<span class="ev-txt">'+(ev.isG?"☁️ ":"• ")+disp+'</span>';
                    html += '<div class="btn-i '+(ev.desc?'has-info':'')+'" onclick="event.stopPropagation(); openDesc(\''+ev.id+'\','+!!ev.isG+')">i</div>';
                    html += '<div class="btn-x" onclick="event.stopPropagation(); delEv(\''+ev.id+'\','+!!ev.isG+')">×</div></div>';
                });
                if(type === 'c' && journalData[key]) {
                    html += '<div class="j-item" onclick="event.stopPropagation();">';
                    html += '<span class="j-text">📝 '+journalData[key]+'</span>';
                    html += '<div class="btn-i has-info" onclick="event.stopPropagation(); openDesc(\''+key+'\', false, true)">i</div>';
                    html += '</div>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        body.innerHTML = html;
        if(M === now.getMonth()) setTimeout(function(){ document.getElementById('scroll-today')?.scrollIntoView({block:"center"}); }, 500);
    }

    // Bar1: Consola inteligenta fara spatii
    function runCommand() {
        var inp = document.getElementById('cmdInput'), val = inp.value.trim(); if(!val) return;
        var curM = viewDate.getMonth(), curY = viewDate.getFullYear();
        
        // 1. Stergere (12D21)
        var mDel = val.match(/^(\d{1,2})D([1-3])(\d+)/i);
        if(mDel) {
            var d = parseInt(mDel[1]), colI = parseInt(mDel[2]), rowI = parseInt(mDel[3]);
            var type = colI === 1 ? 'm' : colI === 2 ? 'c' : 'a';
            var evs = localDB.concat(googleEvents).filter(function(e){ return e.d === d && e.t === type; });
            if(evs[rowI-1]) delEv(evs[rowI-1].id, !!evs[rowI-1].isG);
            inp.value = ""; return;
        }

        // 2. Nota (15NText)
        var mNote = val.match(/^(\d{1,2})N\s*(.*)/i);
        if(mNote) { journalData[curY+'-'+curM+'-'+parseInt(mNote[1])] = mNote[2]; saveAll(); renderCalendar(); inp.value = ""; return; }

        // 3. Adaugare Rapida (15RLGaz sau 15Gaz) - R[n][S/L/A] = recurenta REALA, nu doar eticheta de coloana
        var mEv = val.match(/^(\d{1,2})(R(\d*)([SLA]))?\s*(.*)/i);
        if(mEv) {
            var day = parseInt(mEv[1]), fullPref = mEv[2]||'', interval = parseInt(mEv[3]||'1'), letter = (mEv[4]||'').toUpperCase(), tx = mEv[5]||'';
            var cat = getCategory(fullPref||tx), name = (fullPref?fullPref+' ':'')+tx;

            if (letter) {
                var freqMap = { L: 'MONTHLY', S: 'WEEKLY', A: 'YEARLY' };
                var freq = freqMap[letter];
                if (localStorage.getItem('gcal_token')) {
                    // recurenta reala pe Google Calendar -> apare automat, in fiecare luna/saptamana/an viitor
                    addRecurringToGoogle(day, curM, curY, name, freq, interval);
                } else {
                    // fallback offline: recurenta locala, expandata automat de renderCalendar() in lunile viitoare
                    localDB.push({ id:'L'+Date.now(), d:day, m:curM, y:curY, t:cat, n:name, dur:1, done:false, rec:{freq:freq, interval:interval} });
                    saveAll(); renderCalendar();
                }
            } else {
                localDB.push({ id:'L'+Date.now(), d:day, m:curM, y:curY, t:cat, n:name, dur:1, done:false });
                saveAll(); renderCalendar();
            }
            inp.value = "";
        }
    }

    // Mentinem restul functiilor din v39...
    async function delEv(id, isG) { var ev=localDB.concat(googleEvents).find(function(x){return x.id===id}); if(!ev||!confirm("Ștergi: "+ev.n+"?"))return; if(isG){ var tk=localStorage.getItem('gcal_token'); await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events/"+id,{method:'DELETE',headers:{Authorization:"Bearer "+tk}}); syncGoogle(); } else { localDB=localDB.filter(function(x){return x.id!==id}); saveAll(); renderCalendar(); } }
    function openDesc(id, isG, isJ) { activeDescRef={id:id,isG:isG,isJ:!!isJ}; var t=isJ?journalData[id]:localDB.concat(googleEvents).find(function(x){return x.id===id}).desc; document.getElementById('descText').value=t||""; document.getElementById('descModal').style.display='flex'; }
    document.getElementById('btnSaveDesc').onclick = async function() { var t=document.getElementById('descText').value; if(activeDescRef.isJ) journalData[activeDescRef.id]=t; else if(activeDescRef.isG){ var tk=localStorage.getItem('gcal_token'); await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events/"+activeDescRef.id,{method:'PATCH',headers:{Authorization:"Bearer "+tk,'Content-Type':'application/json'},body:JSON.stringify({description:t})}); syncGoogle(); } else { var e=localDB.find(function(x){return x.id===activeDescRef.id}); if(e) e.desc=t; } saveAll(); closeModal(); renderCalendar(); };
    function toggleZoom() { zoomLevel=(zoomLevel+1)%3; applyZoom(); localStorage.setItem('trident_zoom', zoomLevel); renderCalendar(); }
    function applyZoom() { document.body.classList.remove('compact', 'mini'); if(zoomLevel===1) document.body.classList.add('compact'); if(zoomLevel===2) document.body.classList.add('mini'); }
    function openAddModal(d, t) { editRef={d:d,t:t}; document.getElementById('editModal').style.display='flex'; }
    function closeModal() { document.querySelectorAll('.modal').forEach(function(m){m.style.display='none'}); }
    function saveAll() { localStorage.setItem('trident_db_v41', JSON.stringify(localDB)); localStorage.setItem('trident_j_v41', JSON.stringify(journalData)); }
    function navMonth(dir) { viewDate.setMonth(viewDate.getMonth()+dir); googleEvents=[]; renderCalendar(); syncGoogle(); }
    function toggleEco() { ecoMode=!ecoMode; localStorage.setItem('trident_eco', ecoMode); renderCalendar(); }
    function calLogin() { window.location.href="https://accounts.google.com/o/oauth2/v2/auth?client_id="+GCAL_CLIENT_ID+"&redirect_uri="+encodeURIComponent(GCAL_REDIRECT)+"&response_type=token&scope="+encodeURIComponent("https://www.googleapis.com/auth/calendar.events")+"&prompt=select_account"; }
    function handleGoogleCallback() { var p=new URLSearchParams(window.location.hash.substring(1)); var t=p.get('access_token'); if(t){localStorage.setItem('gcal_token',t); window.location.hash=""; syncGoogle();} }
    async function tglStatus(id, isG) { var ev=localDB.concat(googleEvents).find(function(x){return x.id===id}); if(!ev)return; if(isG){ ev.done=!ev.done; var tk=localStorage.getItem('gcal_token'); await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events/"+id,{method:'PATCH',headers:{Authorization:"Bearer "+tk,'Content-Type':'application/json'},body:JSON.stringify({summary:ev.done?ev.n+" [OK]":ev.n.replace("[OK]","").trim()})}); syncGoogle(); } else { ev.done=!ev.done; saveAll(); renderCalendar(); } }
    document.getElementById('btnSave').onclick = function() { var n=document.getElementById('evName').value.trim(); var dur=parseInt(document.getElementById('evDur').value)||1; if(n) localDB.push({id:'L'+Date.now(), d:editRef.d, m:viewDate.getMonth(), y:viewDate.getFullYear(), t:editRef.t, n:n, dur:dur, done:false }); saveAll(); closeModal(); renderCalendar(); };
</script>
</body>
</html>
