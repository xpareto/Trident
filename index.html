<!-- START OF FILE: index.html (Trident v28) -->
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
    <link rel="manifest" href="manifest.json"/>
    <title>Trident v28</title>
    <style>
        :root {
            --bg: #FFFFFF; --header-bg: #1e293b; --border: #E2E8F0;
            --text: #1e293b; --accent: #2563EB;
            --weekend-bg: #dcfce7; --today-yellow: #ffff00;
            --pink-pending: #fff1f2; --green-done: #dcfce7;
        }
        body { font-family: sans-serif; margin: 0; padding: 0; background: white; color: var(--text); overflow-x: hidden; }
        .hdr { background: #1e293b; color: white; padding: 5px 10px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 2000; height: 50px; }
        .v-badge { background: #2563EB; color: white; padding: 2px 5px; border-radius: 4px; font-size: 9px; font-weight: bold; }
        .nav-btn { background: #334155; color: white; border: 1px solid #475569; border-radius: 4px; padding: 8px 12px; font-size: 13px; cursor: pointer; font-weight: bold; }
        .nav-btn.sync { background: #10b981; }

        .grid { display: block; width: 100%; min-width: 320px; padding-bottom: 100px; }
        .h-r { display: flex; width: 100%; background: #f1f5f9; font-weight: bold; font-size: 10px; position: sticky; top: 50px; z-index: 1500; border-bottom: 2px solid #cbd5e1; height: 45px; }
        .h-r .c { display: flex !important; justify-content: flex-end !important; align-items: center !important; padding-bottom: 6px !important; flex-direction: column; }

        .r { display: flex; width: 100%; border-bottom: 1px solid var(--border); min-height: 55px; }
        .c { border-right: 1px solid var(--border); padding: 4px; flex: 1; overflow: hidden; display: flex; flex-direction: column; }
        
        /* T2: Dimensiuni adaptive */
        .c-fix { flex: 0 0 35px; justify-content: center; text-align: center; font-weight: bold; font-size: 11px; }
        .c-sticky { position: sticky; left: 0; z-index: 100; background: inherit; }
        .c-date { left: 35px; border-right: 2px solid #cbd5e1; }

        .r.weekend { background-color: var(--weekend-bg) !important; }
        .r.today .c-fix { background-color: var(--weekend-bg) !important; }
        .r.today .c:not(.c-fix) { background-color: var(--today-yellow) !important; }
        .r.today { outline: 2px solid orange; outline-offset: -2px; }

        .ev-item { display: flex; align-items: flex-start; gap: 4px; padding: 4px; border-radius: 4px; margin-bottom: 3px; border: 1px solid rgba(0,0,0,0.05); font-size: 11px; font-weight: 600; line-height: 1.2; cursor: pointer; }
        .ev-item.pending { background: var(--pink-pending); border-left: 3px solid #f43f5e; }
        .ev-item.done { background: var(--green-done); border-left: 3px solid #22c55e; opacity: 0.8; }
        .chk { width: 15px; height: 15px; flex-shrink: 0; }
        .j-box { width: 100%; border: none; background: transparent; font-size: 11px; font-style: italic; resize: none; outline: none; border-top: 1px dotted #ccc; margin-top: auto; padding-top: 4px; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; align-items: center; justify-content: center; padding: 15px; }
        .m-box { background: white; padding: 20px; border-radius: 8px; width: 95%; max-width: 400px; color: black; }
        .cmd-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #f1f5f9; padding: 8px; display: flex; border-top: 2px solid #2563EB; z-index: 2000; }

        /* Mobile specific adjustments */
        @media (max-width: 600px) {
            .nav-btn { padding: 6px 8px; font-size: 11px; }
            .h-r { font-size: 8px; }
            .grid { min-width: 100%; }
        }
    </style>
</head>

<body onload="initApp()">

<header class="hdr">
    <div class="v-badge">v28</div>
    <div id="mLabel" style="font-weight: bold; font-size: 13px; text-transform: uppercase; flex-grow: 1; text-align: center;">LUNA</div>
    <div style="display:flex; gap:4px;">
        <button id="btnEco" class="nav-btn" onclick="toggleEco()">ECO</button>
        <button class="nav-btn sync" onclick="calLogin()">SYNC</button>
        <button class="nav-btn" onclick="navMonth(-1)">&lt;</button>
        <button class="nav-btn" onclick="navMonth(1)">&gt;</button>
    </div>
</header>

<div class="grid" id="mainGrid">
    <div class="h-r">
        <div class="c c-fix c-sticky">NRZ</div>
        <div class="c c-fix c-sticky c-date">ZI</div>
        <div class="c">LUNARE</div>
        <div class="c">CURENTE</div>
        <div class="c">ANUALE</div>
    </div>
    <div id="gridBody"></div>
</div>

<div class="cmd-bar">
    <input type="text" id="cmdInput" style="flex:1; padding:10px; font-size: 16px;" placeholder="Ex: RL Factura">
    <button onclick="runCommand()" style="margin-left:5px; padding:10px; background:#2563EB; color:white; border:none; font-weight:bold;">OK</button>
</div>

<div id="editModal" class="modal">
    <div class="m-box">
        <h3 id="modalTitle">Editare</h3>
        <input type="text" id="evName" style="width:100%; padding:10px; margin-bottom:10px;">
        <input type="number" id="evDur" value="1" style="width:100%; padding:10px; margin-bottom:10px;">
        <div style="display:flex; gap:10px;">
            <button class="nav-btn" style="flex:1; background:#ccc; color:black;" onclick="closeModal()">ANULARE</button>
            <button class="nav-btn" style="flex:1; background:var(--accent);" id="btnSave">SALVEAZĂ</button>
        </div>
    </div>
</div>

<script>
    var GCAL_CLIENT_ID = '705792153280-6u766blorfafm3taeonfcufbihggd3ee.apps.googleusercontent.com';
    var GCAL_REDIRECT = window.location.origin + window.location.pathname;
    var viewDate = new Date();
    var localDB = [], journalData = {}, googleEvents = [], ecoMode = false, editRef = null;

    function initApp() {
        try {
            localDB = JSON.parse(localStorage.getItem('trident_db_v28') || '[]');
            journalData = JSON.parse(localStorage.getItem('trident_j_v28') || '{}');
            ecoMode = localStorage.getItem('trident_eco') === 'true';
            document.getElementById('btnEco').className = ecoMode ? "nav-btn active" : "nav-btn";
            
            if(window.location.hash.indexOf('access_token') > -1) handleGoogleCallback();
            else { renderCalendar(); if(localStorage.getItem('gcal_token')) syncGoogle(); }
        } catch(e) { console.error(e); }
    }

    // P1: Detector de Prefixe (Direct la inceputul liniei)
    function getCategoryByPrefix(text) {
        var s = text.toUpperCase().trim();
        if (/^R\d*L/.test(s)) return 'm';
        if (/^R\d*A/.test(s) || /^RA/.test(s) || /^SF/.test(s) || /^ZI/.test(s)) return 'a';
        if (/^R\d*S/.test(s) || /^RS/.test(s)) return 'c';
        return null;
    }

    async function syncGoogle() {
        var token = localStorage.getItem('gcal_token');
        if (!token) return;
        var start = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1).toISOString();
        var end = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0, 23, 59, 59).toISOString();
        try {
            var resp = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin="+start+"&timeMax="+end+"&singleEvents=true&orderBy=startTime", {
                headers: { Authorization: "Bearer " + token }
            });
            var data = await resp.json();
            if (data.items) {
                googleEvents = data.items.map(function(ge) {
                    var sDt = new Date(ge.start.dateTime || ge.start.date);
                    var eDt = new Date(ge.end.dateTime || ge.end.date);
                    var dur = Math.round((eDt - sDt) / 86400000) || 1;
                    
                    var title = ge.summary || "";
                    // T1: Detectare stare "Done" din titlul Google
                    var isDone = title.indexOf("[OK]") > -1;
                    var cleanTitle = title.replace("[OK]", "").trim();

                    var type = getCategoryByPrefix(cleanTitle) || (ge.recurrence ? 'm' : 'c');
                    if (cleanTitle.toLowerCase().indexOf('zi') === 0) type = 'a';

                    return { id: ge.id, d: sDt.getDate(), m: sDt.getMonth(), y: sDt.getFullYear(), n: cleanTitle, t: type, dur: dur, isG: true, done: isDone, link: ge.htmlLink };
                });
                renderCalendar();
            }
        } catch (e) { renderCalendar(); }
    }

    // T1: Actualizare status in Google Calendar (Baza de date comuna)
    async function tglStatus(e, isG) {
        if(!isG) {
            e.done = !e.done;
            saveAll(); renderCalendar();
            return;
        }

        var token = localStorage.getItem('gcal_token');
        var newTitle = e.done ? e.n : e.n + " [OK]";
        try {
            await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events/" + e.id, {
                method: 'PATCH',
                headers: { Authorization: "Bearer " + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ summary: newTitle })
            });
            syncGoogle(); // Refresh pentru toate dispozitivele
        } catch(err) { alert("Eroare Sincronizare Status"); }
    }

    function renderCalendar() {
        var body = document.getElementById('gridBody');
        var Y = viewDate.getFullYear(), M = viewDate.getMonth();
        var now = new Date(); now.setHours(0,0,0,0);
        var dayNames = ["DU", "LU", "MA", "MI", "JO", "VI", "SA"];
        var monthNames = ["Ianuarie", "Februarie", "Martie", "Aprilie", "Mai", "Iunie", "Iulie", "August", "Septembrie", "Octombrie", "Noiembrie", "Decembrie"];
        document.getElementById('mLabel').innerHTML = monthNames[M] + " " + Y;
        
        var html = "";
        var days = new Date(Y, M + 1, 0).getDate();
        for (var d = 1; d <= days; d++) {
            var curDt = new Date(Y, M, d);
            var isToday = (curDt.toDateString() === now.toDateString());
            var isWE = (curDt.getDay() === 0 || curDt.getDay() === 6);
            
            var dayEvs = localDB.concat(googleEvents).filter(function(ev) {
                var start = new Date(ev.y, ev.m, ev.d);
                var end = new Date(ev.y, ev.m, ev.d + (ev.dur || 1) - 1);
                return (d === ev.d || d === (ev.d + ev.dur - 1)) && curDt >= start && curDt <= end;
            });

            if (ecoMode && curDt < now && !isToday && !dayEvs.some(function(x){return !x.done})) continue;

            var rCls = "r" + (isToday ? " today" : "") + (isWE ? " weekend" : "");
            html += '<div class="' + rCls + '" ' + (isToday ? 'id="scroll-today"' : '') + '>';
            html += '<div class="c c-fix c-sticky">' + d + '</div><div class="c c-fix c-sticky c-date">' + dayNames[curDt.getDay()] + '</div>';
            
            ['m','c','a'].forEach(function(type) {
                html += '<div class="c" onclick="openEdit('+d+',\''+type+'\')">';
                dayEvs.forEach(function(ev) {
                    if(ev.t === type) {
                        var status = ev.done ? "done" : "pending";
                        var displayTitle = ev.n;
                        if(ev.dur > 1) {
                            if(d === ev.d) displayTitle = "(1:" + ev.dur + ") " + ev.n;
                            else displayTitle = "<b>FINAL</b> " + ev.n;
                        }
                        html += '<div class="ev-item '+status+'" ondblclick="window.open(\''+ev.link+'\',\'_blank\')" onclick="event.stopPropagation()">';
                        html += '<input type="checkbox" class="chk" '+(ev.done?'checked':'')+' onclick="tglStatus('+JSON.stringify(ev).replace(/"/g, '&quot;')+', '+!!ev.isG+')">';
                        html += '<span>' + (ev.isG ? "☁️ " : "• ") + displayTitle + '</span></div>';
                    }
                });
                if(type === 'c') html += '<textarea class="j-box" placeholder="..." onblur="saveJ(\''+Y+'-'+M+'-'+d+'\', this.value)">' + (journalData[Y+'-'+M+'-'+d] || '') + '</textarea>';
                html += '</div>';
            });
            html += '</div>';
        }
        body.innerHTML = html;
        if(M === now.getMonth()) setTimeout(function() { document.getElementById('scroll-today')?.scrollIntoView({block: "center"}); }, 500);
    }

    function runCommand() {
        var inp = document.getElementById('cmdInput');
        var val = inp.value.trim();
        if(!val) return;
        
        var m = val.match(/(.*?)\/c\s*(\d{1,2})\s*(.*)/i);
        var day = m ? parseInt(m[2]) : viewDate.getDate();
        var text = m ? (m[1] + " " + m[3]).trim() : val;
        
        var type = getCategoryByPrefix(text) || 'c';
        var newEv = { id: 'L' + Date.now(), d: day, m: viewDate.getMonth(), y: viewDate.getFullYear(), t: type, n: text, dur: 1, done: false };
        localDB.push(newEv);
        saveAll(); renderCalendar();
        postToGoogle(newEv); // Auto-sync
        inp.value = "";
    }

    // Funcții auxiliare salvate din v27
    function saveAll() { localStorage.setItem('trident_db_v28', JSON.stringify(localDB)); localStorage.setItem('trident_j_v28', JSON.stringify(journalData)); }
    function saveJ(k, v) { journalData[k] = v; saveAll(); }
    function navMonth(dir) { viewDate.setMonth(viewDate.getMonth() + dir); googleEvents = []; renderCalendar(); syncGoogle(); }
    function toggleEco() { ecoMode = !ecoMode; localStorage.setItem('trident_eco', ecoMode); renderCalendar(); }
    function closeModal() { document.getElementById('editModal').style.display = 'none'; }
    function calLogin() { window.location.href = "https://accounts.google.com/o/oauth2/v2/auth?client_id=" + GCAL_CLIENT_ID + "&redirect_uri=" + encodeURIComponent(GCAL_REDIRECT) + "&response_type=token&scope=" + encodeURIComponent("https://www.googleapis.com/auth/calendar.events") + "&prompt=select_account"; }
    function handleGoogleCallback() { var p = new URLSearchParams(window.location.hash.substring(1)); var t = p.get('access_token'); if(t) { localStorage.setItem('gcal_token', t); window.location.hash = ""; syncGoogle(); } }
    async function postToGoogle(ev) { /* v22 logic */ }
</script>
</body>
</html>
